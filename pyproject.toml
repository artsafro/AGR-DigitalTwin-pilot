[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agr-digitaltwin"
version = "0.1.0"
description = "AGR digital twin: NPM/VPM production pipeline (dt_ai) and delivery QA (twinqa)"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
    "pydantic==2.13.5",
    "Pillow==12.3.0",
    "pypdf==6.19.0",
    "numpy==2.5.3",
    "shapely==2.1.2",
]

[project.optional-dependencies]
pdf-review = ["PyMuPDF==1.28.2"]
cad = ["ezdxf==1.4.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ezdxf==1.4.3", "pytest-xdist==3.8.0"]

[project.scripts]
dt = "dt_ai.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not blender and not dcc and not acad and not perf and not max and not panel_texture'"
pythonpath = [".", "tools/qa"]
markers = [
    "dcc: requires an explicitly supplied Blender executable (DT_BLENDER)",
    "blender: opt-in real background Blender process (select with -m blender)",
    "acad: needs the AutoCAD 2025 core console via dcc_batch.py (select with -m acad)",
    "perf: opt-in wall-clock / CPU-time performance budget (select with -m perf)",
    "max: opt-in real 3ds Max batch process via dcc_batch.py; select with -m max",
    "panel_texture: opt-in AC04 panel-texture publication evidence; select with -m panel_texture",
]
