# Light non-DCC test run per PR on a self-hosted Windows runner [D222] (revises D122).

name: Tests (self-hosted)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests
  cancel-in-progress: false

jobs:
  test:
    # A self-hosted runner must never run untrusted code: skip PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, agr]
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.13"
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Test with pytest (non-DCC suite)
      # A command-line -m replaces the pyproject addopts -m (which lacks `not native_max`);
      # the explicit list below is the same 8-marker exclusion the merge gate uses.
      run: uv run pytest -q -m "not blender and not dcc and not acad and not perf and not job and not max and not panel_texture and not native_max"
