# Manual-only test run [D122]: no automatic CI; the merge gate is the local CI receipt in the PR.

name: Tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.13"
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Test with pytest
      # no -m here: a command-line -m replaces the pyproject addopts one, which already deselects
      # perf, job and the DCC lanes (blender, dcc, acad, max, panel_texture)
      run: uv run pytest -q
