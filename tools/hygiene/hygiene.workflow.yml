# Pinned repo-hygiene on every PR (#1950): the same entry as scripts/hygiene.sh and the agent hooks.
# repo-hygiene is private: set the repository variable HYGIENE_PROJECT to a clone on the runner (the pinned
# commit is checked out there as a detached worktree); without it the step falls back to `uvx git+URL@PIN`.

name: Repository hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    # A self-hosted runner must never run untrusted code: skip PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, agr]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.13"
    - name: New hygiene findings against the PR base
      env:
        HYGIENE_PROJECT: ${{ vars.HYGIENE_PROJECT }}
        BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      run: uv run --no-project python tools/hygiene/hygiene.py check --base "$env:BASE"
