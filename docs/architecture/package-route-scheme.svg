<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут «Пакет и сдача» (НПМ + ВПМ) — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: 961ebe2fb4acef093ee703f30ed327d013e876e3089da98d1cd951c8feca72a2</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: Сцена НПМ / ВПМ, ревизия и SHA-256 исходников; связь с FBX через существующий export_meta</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 4; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Выгрузить FBX и записать export_meta</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Неизвестные факты — unknown, не</tspan>
<tspan x="260.0" dy="20.0">выдуманный ноль</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: FBX + карты; export_meta рядом с FBX,</tspan>
<tspan x="845.0" dy="20.0">вне ZIP</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="510.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Прочитать FBX; для ВПМ подготовить GeoJSON</tspan>
<tspan x="260.0" dy="20.0">Приёмка: MSK-77 — наша работа, FNO — СИНТЕЗ; нет</tspan>
<tspan x="260.0" dy="20.0">данных — отказ</tspan>
</text>
<text x="845.0" y="510.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Свежий readback; GeoJSON по эталону</tspan>
<tspan x="845.0" dy="20.0">заказчика</tspan>
</text>
<text x="260.0" y="655.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Собрать ZIP общим package_core</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Неполный пакет не становится готовым</tspan>
</text>
<text x="845.0" y="655.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: ZIP НПМ либо ВПМ и результат package</tspan>
<tspan x="845.0" dy="20.0">check</tspan>
</text>
<text x="260.0" y="780.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Проверить те же файлы и составить отчёт</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Отказ / not_run не равны pass; ручные</tspan>
<tspan x="260.0" dy="20.0">шлюзы отдельно</tspan>
</text>
<text x="845.0" y="780.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: V001–V017, xView, СИНТЕЗ; отчёт с путями</tspan>
<tspan x="845.0" dy="20.0">и SHA-256</tspan>
</text>
<text x="260.0" y="925.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Передать Артёму на приёмку и публикацию</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Визуальная приёмка отдельно; УКЭП —</tspan>
<tspan x="260.0" dy="20.0">заказчик</tspan>
</text>
<text x="845.0" y="925.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Архив или сцена Max QUAD; передача</tspan>
<tspan x="845.0" dy="20.0">заказчику — Артём</tspan>
</text>
</svg>
