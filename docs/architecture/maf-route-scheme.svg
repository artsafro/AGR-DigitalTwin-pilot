<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут МАФ (GroundEl, НПМ + ВПМ) — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: 372e2f790bdaedaf23b0317235bf027de23851155250491647707f4bd577cc9d</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: Спецификация МАФ и СПОЗУ: ревизия, SHA-256, позиции и точки в реестре исходников</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 4; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Прочитать спецификацию и выбрать кандидатов</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Нет кандидата — объект называет Артём</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Соответствие позиций библиотеки</tspan>
<tspan x="845.0" dy="20.0">спецификации</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Сверить габариты, отделки и подготовить ВПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Габариты и цвет соответствуют проекту</tspan>
</text>
<text x="845.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: МАФ ВПМ с общими ID материалов</tspan>
</text>
<text x="260.0" y="615.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Расставить и подготовить НПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Поворот и утопление по СПОЗУ</tspan>
</text>
<text x="845.0" y="615.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: НПМ / ВПМ в общих точках; UCX только</tspan>
<tspan x="845.0" dy="20.0">Ground</tspan>
</text>
<text x="260.0" y="740.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Проверить экспорт и показать витрину</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Артём принимает витрину; отказы не</tspan>
<tspan x="260.0" dy="20.0">скрыты</tspan>
</text>
<text x="845.0" y="740.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Отчёт MAF и подписанные пары НПМ / ВПМ</tspan>
</text>
<text x="260.0" y="885.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Передать в Ground и на упаковку</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Приёмка пакета отдельно от витрины</tspan>
</text>
<text x="845.0" y="885.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Ground FBX → схема «Пакет и сдача»</tspan>
</text>
