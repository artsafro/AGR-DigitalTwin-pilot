# Context map of the package / delivery route, NPM + VPM, #1393 (follow-up of #1392, D293). Source of truth for
# docs/architecture/package-contexts.excalidraw / .svg. Same schema and generator as contexts.yaml (#1359).
# Every stage context of package-route.events.yaml is listed here with the same owner (route_map.route_coverage).
# duplicates: described rows only (`at` = path:line, `match` = text on that line); the duplicate_guard allowlist
# (incl. the nine frozen job packagers, #1106) stays in contexts.yaml. No `duplicates` key = no duplicates box.
# grid: "col/row" cell of the drawing (all contexts or none; columns >= 1 apart in a row).
# Regenerate: uv run python tools/architecture/route_map.py ; check: ... route_map.py --check
title_ru: "Карта контекстов маршрута «Пакет и сдача» (НПМ + ВПМ) — #1361, D293"
issue: "#1393"
rules:
  - id: described
    owner: docs/architecture/contexts.yaml
    ru: "дубли здесь описательные; охранный список duplicate_guard — в contexts.yaml"
shared_kernel:
  id: zip
  ru: "Общее ядро: один писатель ZIP для AGR Tools и обоих упаковщиков"
  owner: adapters/max/agr_tools/package_core.py
  owner_ru: "план архивов, отказ при дублях / пустых членах / несовпадении снимка; чужие файлы не удаляет (#1361)"
  functions:
    - name: zip_plan
      contract: "папка, адрес, пределы -> архивы для записи + пропуски с причинами; файлы не трогает"
    - name: qa_package
      contract: "пакет, профиль, сцена -> отчёт только для чтения: проваленные стадии по файлам"
contexts:
  - id: dcc
    grid: "0/1"
    ru: "Связь с DCC и приёмка (сцена в 3ds Max)"
    area: docs/agents/CAPABILITIES.md
    owner: src/dt_ai/core/blender_runner.py
    owner_ru: "экспорт из Max или Blender (D212); приёмка — сцена Max QUAD + путь (D270)"
    functions:
      - name: blender_executable
        contract: "путь или DT_BLENDER -> исполняемый файл Blender; нет — ошибка"
      - name: run_blender
        contract: "скрипт, аргументы, ожидаемые выходы, таймаут -> свежий JSON; старый ответ — ошибка"
  - id: export
    grid: "1/1"
    ru: "Экспорт FBX с чтением назад"
    area: docs/domain/export-import.md
    owner: adapters/max/agr_tools/export_core.py
    owner_ru: "проверенный экспорт Max: FBX и отчёт пишутся вместе или не пишутся; рядом — export_meta"
    functions:
      - name: commit
        contract: "сцена, цель, источник, превью, чтение -> FBX + отчёт JSON или отказ до записи"
      - name: readback
        contract: "данные FBX -> объекты, треугольники, материалы, масштаб единиц"
  - id: export-meta
    grid: "2.5/1"
    ru: "Контракт export_meta"
    area: docs/domain/areas/package.md
    owner: adapters/max/agr_tools/export_meta.py
    owner_ru: "schemas/ExportMeta.schema.json; неизвестное — unknown, ноль не подставляется; в ZIP не идёт"
    functions:
      - name: validate_meta
        contract: "запись -> отказ с именем поля (лишние ключи, дубли, provenance)"
      - name: record_export
        contract: "экспорт, факты, provenance -> запись export_meta"
      - name: load_package_meta
        contract: "папка пакета, [--meta] -> ближайшая запись; несколько — отказ, без первого попавшегося"
  - id: validation
    grid: "2.5/2"
    ru: "Чтение экспорта, валидатор V001–V017, xView, отчёт сдачи"
    area: docs/domain/areas/package.md
    owner: tools/qa/validate_package.py
    owner_ru: "проверка пакета по регламенту (agr validate); not_run — не pass"
    functions:
      - name: validate_vpm_zip
        contract: "имя, файлы ZIP, профиль, стадии -> находки ВПМ"
      - name: validate_npm_zip
        contract: "имя, файлы ZIP, профиль, стадии -> находки НПМ"
  - id: geojson
    grid: "0.5/2"
    ru: "GeoJSON ВПМ"
    area: docs/domain/npm-vpm.md
    owner: src/twinqa/geojson.py
    owner_ru: "V011: схема, обязательные значения, Glasses; эталон — GeoJSON заказчика (D220)"
    functions:
      - name: geojson_findings
        contract: "данные, профиль, Ground, имена стёкол -> находки V011"
  - id: package
    grid: "1.5/2"
    ru: "Пакеты НПМ / ВПМ и передача"
    area: docs/domain/areas/package.md
    owner: adapters/max/agr_tools/package_core.py
    owner_ru: "единственный писатель ZIP сдачи (_write_zip): agr package-npm / package-vpm (tools/derive) и AGR Tools (#1361, #1377)"
    functions:
      - name: zip_plan
        contract: "папка, [адрес], [лимиты] -> архивы НПМ/ВПМ и пропуски с причиной; файлы не трогает"
      - name: check_members
        contract: "члены архива -> плоские безопасные имена; плохое имя — ошибка до записи"
      - name: _write_zip
        contract: "папка, архив, цель -> новый ZIP через .partial без перезаписи; дубль, пустой вход, изменение во время упаковки — ошибка"
      - name: zip_apply
        contract: "предпросмотр -> новая папка Сборка_<время>, ZIP + проверка; ГОТОВО.txt только без провалов"
    duplicates:
      - at: "jobs/TEC26-OKS/scripts/package_vpm.py:50"
        match: "zipfile.ZipFile(zpath"
        issue: "#1393"
        ru: "живой писатель ZIP: AC09/run_building.sh:28 -> scripts/package_vpm.py (не вызов package_core)"
        status: live-bypass
        step: "#1377"
  - id: sintez
    grid: "1.5/3"
    ru: "Чекер СИНТЕЗ и загрузка архива"
    area: docs/domain/validation.md
    owner: tools/blender/sintez_checker.py
    owner_ru: "запуск чекера AGR 1.6.1 в Blender на ZIP; находки — доказательство, не вердикт"
    functions:
      - name: dump
        contract: "список проверок чекера -> JSON находок"
    duplicates:
      - at: "jobs/elv-tc-vpm/scripts/run_agr_checker_v003.py:18"
        match: "check_highpoly_lowpoly"
        issue: "#1379"
        ru: "остаётся: замороженная версия v003 запуска чекера elv-tc-vpm; копии КПП1 и ТЭЦ26 стали обёртками (#1379)"
        status: own-duty
        why: "замороженный диагностический запуск черновика ЭЛВ, не сдача и не twinQA"
relations:
  - from: dcc
    to: export
    ru: "сцена НПМ / ВПМ"
  - from: export
    to: export-meta
    ru: "FBX + факты"
  - from: export
    to: validation
    ru: "свежее чтение"
  - from: export-meta
    to: package
    ru: "адрес, верх, превью"
  - from: geojson
    to: package
    ru: "GeoJSON ВПМ"
  - from: zip
    to: package
    ru: "запись ZIP"
  - from: package
    to: validation
    ru: "ZIP сдачи"
  - from: package
    to: sintez
    ru: "те же ZIP"
