# Context map of the package / delivery route, NPM + VPM, #1393 (follow-up of #1392, D293). Source of truth for
# docs/architecture/package-contexts.excalidraw / .svg. Same schema and generator as contexts.yaml (#1359).
# Every stage context of package-route.events.yaml is listed here with the same owner (route_map.route_coverage).
# duplicates: described rows use path:line; the shared rename bypass repeats its function/hash identity from
# contexts.yaml so it is counted once. No `duplicates` key = no duplicates box.
# grid: "col/row" cell of the drawing (all contexts or none; columns >= 1 apart in a row).
# Regenerate: uv run python tools/architecture/route_map.py ; check: ... route_map.py --check
title_ru: "Карта контекстов маршрута «Пакет и сдача» (НПМ + ВПМ) — #1361, D293"
issue: "#1393"
rules:
  - id: described
    owner: docs/architecture/contexts.yaml
    ru: "описательные строки с указанием места в коде"
  - id: delivery-zip
    owner: adapters/max/agr_tools/package_core.py
    ru: "свой писатель ZIP вместо общего _write_zip; охрана jobs/, tools/, src/ (#1377)"
shared_kernel:
  serves_stage: package
  id: zip
  ru: "Общее ядро: один писатель ZIP для AGR Tools и обоих упаковщиков"
  owner: adapters/max/agr_tools/package_core.py
  owner_ru: "план архивов, отказ при дублях / пустых членах / несовпадении снимка; чужие файлы не удаляет (#1361)"
  functions:
    - name: zip_plan
      contract: "папка, адрес, пределы -> архивы для записи + пропуски с причинами; файлы не трогает"
contexts:
  - id: dcc
    grid: "0/1"
    ru: "Связь с DCC и приёмка (сцена в 3ds Max)"
    area: docs/agents/CAPABILITIES.md
    owner: src/dt_ai/core/blender_runner.py
    owner_ru: "запуск Blender (D212); приёмку делает Артём вручную по сцене Max QUAD + пути (D270), владельца в коде у неё нет"
    functions:
      - name: blender_executable
        contract: "--blender > DT_BLENDER (CLI dt qa / agr) > TWINQA_BLENDER (blender_runner) > установка 5.1.2; путь к Blender"
      - name: run_blender
        contract: "скрипт, аргументы, ожидаемые выходы, таймаут -> свежий JSON; старый ответ — ошибка"
  - id: export
    grid: "1/1"
    ru: "Экспорт FBX с чтением назад"
    area: docs/domain/export-import.md
    owner: adapters/max/agr_tools/export_core.py
    owner_ru: "проверенный экспорт Max: FBX и отчёт пишутся вместе или не пишутся; рядом — export_meta"
    functions:
      - name: commit
        contract: "сцена, цель, источник, превью, чтение -> FBX + отчёт JSON или отказ до записи"
      - name: readback
        contract: "данные FBX -> объекты, треугольники, материалы, масштаб единиц"
  - id: export-meta
    grid: "2.5/1"
    ru: "Контракт export_meta"
    area: docs/domain/areas/package.md
    owner: adapters/max/agr_tools/export_meta.py
    owner_ru: "schemas/ExportMeta.schema.json; неизвестное — unknown, ноль не подставляется; в ZIP не идёт"
    functions:
      - name: validate_meta
        contract: "запись -> отказ с именем поля (лишние ключи, дубли, provenance)"
      - name: record_export
        contract: "экспорт, факты, provenance -> запись export_meta"
      - name: address_meta_path
        contract: "папка пакета, [--meta], prefer_oks -> запись адреса: --meta; иначе общий export_meta.json папки (важнее sidecar); иначе единственный sidecar, для НПМ — единственный sidecar ОКС; несколько — отказ; pkg.parent/export_meta.json — только если в папке записей нет"
      - name: export_binding
        contract: "члены архива, записи export_meta -> привязка каждого FBX к записанному SHA-256 экспорта (exported_sha256 / fbx_records); нет записи, конфликт или несовпадение — проблема, оба упаковщика отказывают"
  - id: validation
    grid: "2.5/2"
    ru: "Чтение экспорта, валидатор V001–V017, xView, отчёт сдачи"
    area: docs/domain/areas/package.md
    owner: tools/qa/validate_package.py
    owner_ru: "проверка пакета по регламенту (agr validate); not_run — не pass"
    functions:
      - name: validate_vpm_zip
        contract: "имя, файлы ZIP, профиль, стадии -> находки ВПМ"
      - name: validate_npm_zip
        contract: "имя, файлы ZIP, профиль, стадии -> находки НПМ"
  - id: geojson
    grid: "0.5/2"
    ru: "GeoJSON ВПМ"
    area: docs/domain/npm-vpm.md
    owner: src/twinqa/geojson.py
    owner_ru: "V011: схема, обязательные значения, Glasses; эталон — GeoJSON заказчика (D220)"
    functions:
      - name: geojson_findings
        contract: "данные, профиль, Ground, имена стёкол -> находки V011"
  - id: package
    grid: "1.5/2"
    ru: "Пакеты НПМ / ВПМ и передача"
    area: docs/domain/areas/package.md
    owner: adapters/max/agr_tools/package_core.py
    owner_ru: "общий писатель ZIP сдачи (_write_zip): agr package-npm / package-vpm (tools/derive) и AGR Tools (#1361, #1377)"
    functions:
      - name: zip_plan
        contract: "папка, [адрес], [лимиты] -> архивы НПМ/ВПМ и пропуски с причиной; файлы не трогает"
      - name: check_members
        contract: "члены архива -> плоские безопасные имена; плохое имя — ошибка до записи"
      - name: _write_zip
        contract: "папка, архив, цель -> новый ZIP через .partial без перезаписи; дубль, пустой вход, изменение во время упаковки — ошибка"
      - name: zip_apply
        contract: "предпросмотр -> новая папка Сборка_<время>, ZIP + проверка; ГОТОВО.txt только без провалов"
      - name: delivery_receipt
        contract: "сданный ZIP / .max -> квитанция {file, sha256, size}: контроль байтов, не приёмка модели (#1647)"
      - name: check_delivery_receipt
        contract: "файл, квитанция -> пересчёт хеша; неполная, чужая или устаревшая квитанция — отказ, не обновление; agr validate читает её из <ZIP>.delivery.json / package_report.json"
      - name: qa_package
        contract: "набор пакетов -> отчёт только для чтения; сверка пары ОКС <-> Ground (geojson_cross) и одного мастера (manifest_cross_master): сосед найден; результат сверки может быть неполным (#1681)"
      - name: cross_passports
        contract: "пути пакетов -> находки geojson_cross по найденным парам; обязанность ядра, agr validate её не выполняет"
      - name: cross_masters
        contract: "пути пакетов -> находки manifest_cross_master; обязанность ядра, agr validate её не выполняет"
    duplicates:
      - at: "jobs/TEC26-OKS/scripts/package_vpm.py:50"
        match: "zipfile.ZipFile(zpath"
        issue: "#1393"
        ru: "живой писатель ZIP: AC09/run_building.sh:28 -> scripts/package_vpm.py (не вызов package_core)"
        status: live-bypass
        step: "#1377"
      - at: "jobs/VATUTINO-SITE/npm_code.py::rename_npm_zip"
        rule: delivery-zip
        issue: "#1377"
        hash: "c099bec414"
        ru: "rename_npm_zip: пересобирает НПМ-ZIP с кодом района через zipfile в обход _write_zip, без квитанции сдачи (#1424)"
        status: live-bypass
        step: "#1675"
      - at: "jobs/VATUTINO-SITE/run_delivery.py::main"
        rule: delivery-zip
        issue: "#1377"
        hash: "bc783edf3f"
        ru: "исторический драйвер сдачи Ватутино v009 в обход package_core: след Ватутино подтверждает validate -> sintez -> report, но не этап package"
        status: historical
  - id: sintez
    grid: "1.5/3"
    ru: "Чекер СИНТЕЗ и загрузка архива"
    area: docs/domain/validation.md
    owner: tools/qa/sintez_checker.py
    owner_ru: "agr checker: ZIP папки -> чекер AGR 1.6.1 в Blender (tools/blender/sintez_checker.py через blender_runner); находки — доказательство, не вердикт"
    functions:
      - name: classify
        contract: "папка -> не больше одного ZIP ВПМ (hp) и одного НПМ (lp); иначе отказ"
      - name: run
        contract: "папка, выход -> копия ZIP, запуск чекера, сводка NEW.json; изменение ZIP во время прогона — отказ"
    duplicates:
      - at: "jobs/elv-tc-vpm/scripts/run_agr_checker_v003.py:18"
        match: "check_highpoly_lowpoly"
        issue: "#1379"
        ru: "замороженная версия v003 запуска чекера elv-tc-vpm; новый запуск — agr checker; копии КПП1 и ТЭЦ26 стали обёртками (#1379)"
        status: superseded
        why: "заменён командой agr checker; ЭЛВ не сдан, поэтому не historical (finished_jobs), живого вызова нет"
relations:
  - from: dcc
    to: export
    ru: "сцена НПМ / ВПМ"
  - from: export
    to: export-meta
    ru: "FBX + факты"
  - from: export
    to: validation
    ru: "свежее чтение"
  - from: export-meta
    to: package
    ru: "адрес, верх, превью"
  - from: geojson
    to: package
    ru: "GeoJSON ВПМ"
  - from: zip
    to: package
    ru: "запись ZIP"
  - from: package
    to: validation
    ru: "ZIP + квитанция; passed/status упаковщика валидатор не читает"
  - from: package
    to: sintez
    ru: "те же ZIP"
