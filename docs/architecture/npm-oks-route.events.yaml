# Event storm of the NPM/OKS route on KPP1 (#1359). Source of truth for docs/architecture/npm-oks-route.excalidraw.
# Labels for Artem are Russian (*_ru, ru); commands, D-rows, paths and ids stay as in the repo.
# commands: existing `agr` / `dt` commands only (checked by tests/test_architecture_map_1359.py).
# branches (#1375, D292): a task-dependent choice inside one stage: id, when_ru, ru, rules, evidence, [commands].
# rules: D-rows of docs/decisions.md. evidence: repo paths that exist. context: id from contexts.yaml.
# Regenerate: uv run python tools/architecture/route_map.py
title_ru: "Маршрут НПМ / ОКС v2 на КПП1: событийный штурм"
route: oks-npm
scheme:
  export_context:
    ref: package-contexts.yaml#export
  source_ru: "КПП1: sources.json — состав исходников фиксируется путями и SHA-256 (кроме RVT); build manifest отказывает при смешении ревизий одного источника (#1592), ревизию альбома сверяем вручную (D274)"
  steps:
    - stages: "sources,parts,gate1"
      ru: "Описать исходники и согласовать состав"
      artifact_ru: "Реестр исходников + PartsList"
      gate_ru: "Артём подтвердил части (Gate 1)"
    - stages: "model,uv,npm"
      ru: "Построить модель и собрать UV / атлас"
      artifact_ru: "Сцена НПМ; либо мастер → НПМ"
      gate_ru: "Состав и отделки сверены с проектом"
    - stages: "export"
      ru: "Выгрузить FBX и собрать пакет"
      artifact_ru: "FBX + export_meta + ZIP; детали — схема «Пакет и сдача»"
      gate_ru: "Упаковка не означает приёмку"
    - stages: "readback,validate,sintez"
      ru: "Прочитать экспорт и выполнить проверки"
      artifact_ru: "Свежий отчёт, xView и находки СИНТЕЗ на тех же файлах"
      gate_ru: "Отказ / not_run не равны pass"
    - stages: "delivered"
      ru: "Передать результат Артёму"
      artifact_ru: "Пакет или сцена Max QUAD для приёмки"
      gate_ru: "Визуальная приёмка Артёма отдельно от публикации"
object: KPP1
issue: "#1359"
actors:
  - id: agent
    ru: "Агент"
  - id: agent-dcc
    ru: "Агент: Blender / Max / AGR Tools"
  - id: artem
    ru: "Артём"
  - id: checker
    ru: "Чекер СИНТЕЗ"
stages:
  - id: sources
    event_ru: "Исходники получены и описаны"
    actor: agent
    context: dcc
    commands:
      - "agr inspect"
      - "dt index-pdf"
    rules:
      - D186
      - D274
    evidence:
      - jobs/KPP1/LESSONS.md
      - jobs/KPP1/sources.json
  - id: parts
    event_ru: "Состав частей (PartsList) составлен"
    actor: agent
    context: parts
    commands:
      - "dt inspect"
    rules:
      - D276
      - D010
    evidence:
      - jobs/KPP1/cold-run-1172/parts-v001.json
  - id: gate1
    event_ru: "Gate 1: Артём подтвердил части"
    actor: artem
    context: parts
    rules:
      - D238
      - D186
    evidence:
      - jobs/KPP1/cold-run-1172/parts-v001.json
  - id: model
    event_ru: "Модель построена (мастер или сразу НПМ — по задаче)"
    actor: agent-dcc
    context: body
    commands:
      - "dt spec compare"
    rules:
      - D292
      - D254
      - D038
      - D204
      - D255
      - D293
      - D312
    evidence:
      - jobs/KPP1/STATE.md
      - jobs/KPP1/spec-compare-v003.md
    branches:
      - id: vpm-npm-master
        when_ru: "задача ВПМ + НПМ"
        ru: "строим ВПМ или mid-poly мастер, НПМ выводим из него"
        rules:
          - D292
          - D010
        evidence:
          - docs/domain/areas/derivation.md
          - jobs/KPP1/STATE.md
      - id: npm-only-direct
        when_ru: "задача только НПМ"
        ru: "строим НПМ сразу, без mid-poly мастера"
        rules:
          - D292
        evidence:
          - docs/domain/areas/derivation.md
      - id: window-library
        when_ru: "окно из библиотеки подходит к проёму"
        ru: "ставим библиотечное окно с небольшим врезом контура в проём"
        rules:
          - D292
          - D258
        evidence:
          - library/windows/window_types.json
          - docs/procedure/node-r4-window-glazing.md
      - id: window-generator
        when_ru: "подходящего окна в библиотеке нет"
        ru: "окно строит генератор окон (#1338 / #1345)"
        rules:
          - D292
        evidence:
          - adapters/max/agr_tools/windowgen_core.py
          - jobs/KPP1/windowgen-1338/README.md
  - id: uv
    event_ru: "UV и атлас НПМ готовы"
    actor: agent-dcc
    context: uv-atlas
    commands:
      - "agr vpm-to-npm"
      - "dt derive atlas"
    rules:
      - D292
      - D278
      - D280
      - D221
      - D225
      - D293
    evidence:
      - docs/research/bench-npm-derivation.md
    branches:
      - id: atlas-udim
        when_ru: "путь А: через UDIM"
        ru: "мастер развёрнут в UDIM, атлас НПМ собран из UDIM (npm_atlas_udim; команды agr/dt нет)"
        rules:
          - D292
          - D209
          - D221
        evidence:
          - tools/materials/npm_atlas_udim.py
      - id: atlas-material-ids
        when_ru: "путь Б: напрямую по ID материалов"
        ru: "ID = отделка из спецификации; текстура из библиотеки, или готовый диффуз, или новый сгенерированный диффуз (добавляем в библиотеку), затем на атлас"
        commands:
          - "dt derive atlas"
        rules:
          - D292
          - D278
        evidence:
          - tools/derive/npm_atlas.py
          - library/materials/maps_v001.json
  - id: npm
    event_ru: "Экспортированный НПМ-FBX с привязкой к мастеру; на атласе, без UCX"
    actor: agent-dcc
    context: npm
    commands:
      - "dt derive npm"
    rules:
      - D292
      - D293
      - D301
    evidence:
      - routes/npm-oks.md
      - tools/derive/export_npm.py
      - docs/domain/areas/derivation.md
    branches:
      - id: job-copy
        when_ru: "облегчаем библиотечный объект"
        ru: "только копия <original>__<job> вне библиотеки; оригинал не меняем; копия в манифесте задания для очистки после сдачи"
        rules:
          - D301
        evidence:
          - library/flora/README.md
      - id: budget-options
        when_ru: "выбираем бюджет НПМ"
        ru: "агент приносит варианты 50k / 60k / 70k, Артём сокращает; это варианты задания, не замена нормативному лимиту (#1412)"
        rules:
          - D010
        evidence:
          - docs/architecture/report-1359.md
      - id: flora-opacity
        when_ru: "в сдаче есть Flora"
        ru: "Flora ВСЕГДА с opacity: НПМ — отдельная opacity-карта формирует силуэт; ВПМ — Diffuse с alpha. Временные карты допустимы, вид Артём проверяет в конце (#1412)"
        rules:
          - D299
        evidence:
          - docs/architecture/report-1359.md
  - id: export
    event_ru: "Экспорт и пакет собраны"
    actor: agent-dcc
    context: package
    commands:
      - "agr package-npm"
    rules:
      - D292
      - D198
      - D224
      - D293
    evidence:
      - jobs/KPP1/STATE.md
      - adapters/max/agr_tools/package_core.py
    branches:
      - id: package-vpm
        when_ru: "сдаём ВПМ"
        ru: "упаковщик ВПМ"
        commands:
          - "agr package-vpm"
        rules:
          - D292
          - D224
        evidence:
          - tools/derive/package_vpm.py
      - id: package-npm
        when_ru: "сдаём НПМ"
        ru: "упаковщик НПМ (#1361)"
        commands:
          - "agr package-npm"
        rules:
          - D292
        evidence:
          - tools/derive/package_npm.py
  - id: readback
    event_ru: "FBX из ZIP заново прочитаны: agr build-manifest (fbx_readback), manifest_findings связывает проверку с ZIP; dt qa xview — визуальное чтение одного FBX"
    actor: agent-dcc
    context: dcc
    commands:
      - "agr build-manifest"
      - "dt qa xview"
    rules:
      - D273
      - D293
    evidence:
      - docs/research/bench-npm-derivation.md
  - id: validate
    event_ru: "Проверки и xView выполнены, отказы записаны"
    actor: agent
    context: validation
    commands:
      - "agr validate"
      - "dt qa xview"
    rules:
      - D256
      - D273
    evidence:
      - docs/research/bench-npm-derivation.md
      - jobs/KPP1/LESSONS.md
  - id: sintez
    event_ru: "Чекер СИНТЕЗ отработал на тех же файлах"
    actor: checker
    context: sintez
    commands:
      - agr checker
    rules:
      - D220
      - D270
    evidence:
      - tools/qa/sintez_checker.py
  - id: delivered
    event_ru: "Архив или Max-сцена с квадами переданы Артёму; он принимает и передаёт заказчику"
    actor: artem
    context: package
    rules:
      - D270
      - D262
      - D271
      - D300
    evidence:
      - jobs/KPP1/REPORT.md
hotspots:
  - id: delivery-record-missing
    stage: delivered
    ru: "jobs/KPP1/REPORT.md — отчёт сборки, не акт сдачи: строки 5–6 сами отделяют приёмку производственного цикла от сдачи пакета; записи передачи в репозитории пока нет"
    evidence:
      - jobs/KPP1/REPORT.md
  - id: tool-choice
    stage: model
    ru: "Решено D293: агент выбирает Blender / Max / AGR Tools на каждом шаге и пишет почему одной строкой; инструмент не назначен всему маршруту. D312: мастер — квады где возможно; неизбежные треугольники считаем по объекту и доле граней, n-gon >4 запрещён до триангуляции экспорта"
    rules:
      - D293
      - D312
    evidence:
      - docs/domain/areas/body.md
  - id: tile-scale
    stage: uv
    ru: "4096 tile: сторона квада 3.8–4 m; UV-острова могут перекрываться / stack (Артём 2026-11-15, #1380 comment-6893094521); это не универсальный лимит НПМ ОКС"
    rules:
      - D021
    evidence:
      - docs/architecture/report-1359.md
  - id: site-interface
    stage: npm
    ru: "Только если в задании есть участок (D293): плоский Ground → ID/текстуры → проекция на рельеф → поправка текстур + юбка → UCX только ВПМ → МАФ/Flora → НПМ на атласе до экспорта. МАФ-ограды/навесы без UCX; не попавшие на поверхность объекты удаляем с записью причины"
    rules:
      - D293
      - D298
      - D302
    evidence:
      - docs/architecture/ground-route.events.yaml
      - docs/architecture/maf-route.events.yaml
  - id: dcc-runner
    stage: readback
    ru: "Закрыто #1378: владелец команд Blender — blender_runner.blender_command / run_blender; старые драйверы перечислены с причинами, не новые точки входа"
    rules:
      - D273
    evidence:
      - src/dt_ai/core/blender_runner.py
      - docs/architecture/contexts.yaml
  - id: parapet-roof-seam
    stage: model
    ru: "Шов парапет / кровля: толщина парапета и плита кровли были под вопросом архитектору (D249), закрыты только D254; вставная кровля переделана в v007; замер шва — #1339. Решено (D292, R6 #1352): кровля врезана контуром в стены парапета и поднята на несколько мм над низом парапета, не вровень"
    rules:
      - D292
      - D249
      - D254
      - D038
      - D039
    evidence:
      - jobs/KPP1/seam-1339/README.md
      - jobs/KPP1/STATE.md
  - id: windows
    stage: model
    ru: "Окна: проёмы Revit и меша не совпали (spec-compare v002: «no match» только по проёмам); витраж C35 дал пары V004 (D256); генератор окон #1338 — пока только замер. Решено (D292): библиотечное окно с небольшим врезом, если подходит, иначе генератор"
    rules:
      - D292
      - D204
      - D256
      - D258
    evidence:
      - jobs/KPP1/spec-compare-v002.md
      - jobs/KPP1/windowgen-1338/README.md
  - id: udim
    stage: uv
    ru: "Закрыто #1376: живой маршрут НПМ использует udimtile_core; охрана jobs/ + tools/ + src/. Исторические копии не переписываем; остальные адреса/причины — contexts.yaml (#1424)"
    rules:
      - D209
      - D221
    evidence:
      - jobs/KPP1/scripts/vpm_uv.py
      - jobs/TEC26-OKS/scripts/vpm_uv.py
  - id: two-atlases
    stage: uv
    ru: "Два атласа: канон Max atlas_core (D225) и Python npm_atlas_udim (путь А, D292); agr vpm-to-npm идёт через dt derive atlas (путь Б); перевод в #1141 открыт"
    rules:
      - D292
      - D225
      - D278
    evidence:
      - tools/materials/npm_atlas_udim.py
      - adapters/max/agr_tools/atlas_core.py
  - id: package
    stage: export
    ru: "Закрыто #1377 / #1361: единственный писатель ZIP сдачи — package_core._write_zip; agr package-npm / package-vpm и AGR Tools используют его. Исторические упаковщики сохранены. Один FBX не заменяет ZIP + GeoJSON и проверки V001/V011/V013"
    rules:
      - D224
      - D198
    evidence:
      - tools/derive/package_vpm.py
      - jobs/KPP1/LESSONS.md
      - adapters/max/agr_tools/package_core.py
  - id: xview-overlaps
    stage: validate
    ru: "xView: 112 / 116 перекрытых граней на мастере и экспорте (#1343) — не пройдено; V015 / V017 ждут ручной проверки"
    rules:
      - D280
    evidence:
      - docs/research/bench-npm-derivation.md
