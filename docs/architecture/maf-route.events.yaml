# Event storm of the MAF (GroundEl) route, NPM + VPM (#1393, follow-up of #1383 / #1392, Artem 2026-11-14).
# Source of truth for docs/architecture/maf-route.excalidraw / .svg. Same method and generator as the NPM/OKS map
# (#1359) and the VPM OKS / Ground maps (#1383, #1392): Russian labels for Artem; commands, D-rows, paths and ids as
# in the repo. commands: existing `agr` / `dt` commands only; a stage without one is drawn dashed «Нет команды agr/dt».
# rules: D-rows of docs/decisions.md. evidence: repo paths that exist (model-maf skill, MAF sheet, library/maf,
# Vatutino MAF set, block #425 route). Steps are tool-agnostic: «Агент: Blender / Max / AGR Tools» [D293 (1)].
# NPM stage: conversion VPM -> NPM OR parallel placement of both [D293 (5)].
# context: id from contexts.yaml or from local_contexts below; every stage context is also listed with the same
# owner in this route's own context map maf-contexts.yaml (route_coverage).
# hotspots = RED boxes: a fact the repo leaves open or a step it does not define (a question, not an invention).
# Checked by tests/test_route_maps_1393.py. Regenerate: uv run python tools/architecture/route_map.py
title_ru: "Маршрут МАФ (GroundEl, НПМ + ВПМ): событийный штурм (библиотека 931, Ватутино v005 / v006, «Верона»)"
route: maf
scheme:
  export_context:
    ref: package-contexts.yaml#export
  source_ru: "Спецификация МАФ и СПОЗУ: ревизия, SHA-256, позиции и точки в реестре исходников"
  steps:
    - stages: "sources,library,pick"
      ru: "Прочитать спецификацию и выбрать кандидатов"
      artifact_ru: "Соответствие позиций библиотеки спецификации"
      gate_ru: "Нет кандидата — объект называет Артём"
    - stages: "dims,ids,vpm"
      ru: "Сверить габариты, отделки и подготовить ВПМ"
      artifact_ru: "МАФ ВПМ с общими ID материалов"
      gate_ru: "Габариты и цвет соответствуют проекту"
    - stages: "placement,npm,ucx"
      ru: "Расставить и подготовить НПМ"
      artifact_ru: "НПМ / ВПМ в общих точках; UCX только Ground"
      gate_ru: "Поворот и утопление по СПОЗУ"
    - stages: "checks,showcase"
      ru: "Проверить экспорт и показать витрину"
      artifact_ru: "Отчёт MAF и подписанные пары НПМ / ВПМ"
      gate_ru: "Артём принимает витрину; отказы не скрыты"
    - stages: "package"
      ru: "Передать в Ground и на упаковку"
      artifact_ru: "Ground FBX → схема «Пакет и сдача»"
      gate_ru: "Приёмка пакета отдельно от витрины"
object: "VATUTINO-SITE (MAF v005 / v006, «Верона»), silikatny-maf-viz"
issue: "#1393"
actors:
  - id: agent
    ru: "Агент"
  - id: agent-dcc
    ru: "Агент: Blender / Max / AGR Tools"
  - id: artem
    ru: "Артём"
