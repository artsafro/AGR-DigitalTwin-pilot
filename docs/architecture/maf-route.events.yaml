        rules:
          - D095
          - D152
        evidence:
          - docs/domain/areas/groundel-maf.md
      - id: viz
        when_ru: "только визуализация"
        ru: "mid-poly в Blender, один общий Multi/Sub, box UV 1 м — вне маршрута НПМ / ВПМ"
