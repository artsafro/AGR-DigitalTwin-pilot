  - id: pick
    event_ru: "Кандидат выбран: превью = картинка спецификации и контур DWG; нет в каталоге — Артём называет объект"
    actor: agent
    context: maf-library
    rules:
      - D164
      - D190
    evidence:
      - .agents/skills/model-maf/SKILL.md
      - docs/domain/areas/groundel-maf.md
    branches:
