# Context map of the NPM/OKS route on KPP1 (#1359). Source of truth for docs/architecture/contexts.excalidraw.
# Labels for Artem are Russian (ru, contract); ids, paths and function names stay as in the code.
# duplicates: outside the owner. Described rows: `at` = path:line, `match` = text that must be on that line.
# `rule` = a duplicate_guard rule; rule-tagged rows are the guard allowlist, keyed by `at: path.py::function`
# (`<module>` at top level; #1387: never a bare line) + optional `hash` (printed by the guard) pinning one copy.
# `status` (#1424, every row of every context map, derived from real call chains by duplicate_guard + call_chains):
#   live-bypass = a live command/route reaches the file and it does not call the owner (`step`: compaction issue,
#   "-" = no card yet; NEW rows fail against LIVE_BYPASS_BASELINE); wrapper = calls the owner; historical = no live
#   chain AND inside a `finished_jobs` folder; own-duty = other responsibility, `why` says which (Russian).
# Regenerate: uv run python tools/architecture/route_map.py ; check: tools/architecture/duplicate_guard.py
