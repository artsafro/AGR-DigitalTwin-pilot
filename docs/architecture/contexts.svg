<text x="1268" y="1056.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268" dy="14">Экспорт и пакет сдачи</tspan>
<tspan x="1268" dy="17.5">Владелец: tools/derive/package_vpm.py</tspan>
<tspan x="1268" dy="17.5">общий упаковщик ВПМ (dt derive package / agr package-vpm,</tspan>
<tspan x="1268" dy="17.5">#1106)</tspan>
<tspan x="1268" dy="17.5"></tspan>
<tspan x="1268" dy="17.5">main: папка пакета, папка текстур, [--object],</tspan>
<tspan x="1268" dy="17.5">[--no-geojson] -&gt; SM_&lt;Адрес&gt;.zip + package_report.json;</tspan>
<tspan x="1268" dy="17.5">занятый путь — отказ</tspan>
<tspan x="1268" dy="17.5">load_object: object.json -&gt; имя, привязка, стёкла; пустое</tspan>
<tspan x="1268" dy="17.5">и неизвестное — ошибка</tspan>
<tspan x="1268" dy="17.5">unique_object: пары ключ-значение JSON -&gt; словарь; повтор</tspan>
<tspan x="1268" dy="17.5">ключа — ошибка</tspan>
<tspan x="1268" dy="17.5">default_glasses: адрес -&gt; предложение прозрачного стекла</tspan>
<tspan x="1268" dy="17.5">КПП1</tspan>
</text>
