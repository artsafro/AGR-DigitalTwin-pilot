<text x="40" y="0" font-size="28" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="28">Карта контекстов маршрута НПМ/ОКС (КПП1) (#1359)</tspan>
</text>
<text x="40" y="44" font-size="16" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="16">Легенда: зелёный — модуль-владелец и его функции (контракт: вход -&gt; выход); жёлтый — общее ядро; розовый — число записей вне владельца (адреса в таблице владельцев); стрелки — передача между владельцами</tspan>
</text>
<text x="963.0" y="120.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Общее ядро: номер тайла UDIM</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/udimtile_core.py</tspan>
<tspan x="963.0" dy="17.5">одна функция UDIM (#1337), едет и в MZP AGR Tools</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">udim_tile: u, v (конечные, 0 ≤ u &lt; 10, v ≥ 0) -&gt; номер</tspan>
<tspan x="963.0" dy="17.5">тайла 1001 + ⌊u⌋ + 10·⌊v⌋; вне области — UdimDomainError</tspan>
<tspan x="963.0" dy="17.5">face_tile: углы UV грани (≥ 3), strict -&gt; тайл центра</tspan>
<tspan x="963.0" dy="17.5">грани; угол в чужом тайле — UdimCrossTileError</tspan>
<tspan x="963.0" dy="17.5">tile_origin: номер тайла -&gt; (столбец, ряд) его левого</tspan>
<tspan x="963.0" dy="17.5">нижнего угла</tspan>
<tspan x="963.0" dy="17.5">udim_of_cell: целые (столбец, ряд) -&gt; номер тайла</tspan>
</text>
<text x="963.0" y="346.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="12">Дубли вне владельца: 55</tspan>
<tspan x="963.0" dy="15.0">Правило проверки: своя формула UDIM 1001 + u + 10·v (или обратная)</tspan>
<tspan x="963.0" dy="15.0">вместо общей функции; охрана jobs/, tools/, src/ (#1376)</tspan>
</text>
<text x="48" y="471.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48" dy="14">Корпус и геометрия</tspan>
<tspan x="48" dy="17.5">Владелец: src/dt_ai/ops/operations.py</tspan>
<tspan x="48" dy="17.5">операции над частями с проверкой инвариантов и откатом</tspan>
<tspan x="48" dy="17.5"></tspan>
<tspan x="48" dy="17.5">run_operation: сцена, операция, часть, функция правки -&gt;</tspan>
<tspan x="48" dy="17.5">OperationResult; при нарушении инварианта — откат</tspan>
<tspan x="48" dy="17.5">embed_into_neighbour: сцена, часть, сосед, направление,</tspan>
<tspan x="48" dy="17.5">глубина, м -&gt; новая сцена (врезка декора, D199)</tspan>
<tspan x="48" dy="17.5">primitive_box: сцена, часть -&gt; часть заменена коробкой в</tspan>
<tspan x="48" dy="17.5">пределах силуэта</tspan>
<tspan x="48" dy="17.5">to_opacity_plane: сцена, часть -&gt; плоскость с картой</tspan>
<tspan x="48" dy="17.5">прозрачности (НПМ)</tspan>
<tspan x="48" dy="17.5">plan_opacity_swaps: сцена, кандидаты, бюджет</tspan>
<tspan x="48" dy="17.5">треугольников -&gt; список замен на плоскости</tspan>
</text>
<text x="48" y="750.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="48" dy="12">Дубли вне владельца: 3</tspan>
</text>
<text x="658" y="471.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658" dy="14">UV и атлас</tspan>
<tspan x="658" dy="17.5">Владелец: adapters/max/agr_tools/atlas_core.py</tspan>
<tspan x="658" dy="17.5">каноническая упаковка атласа (D225); Python-версии</tspan>
<tspan x="658" dy="17.5">переводятся на неё в #1141</tspan>
<tspan x="658" dy="17.5"></tspan>
<tspan x="658" dy="17.5">pack: вершины, UV, грани, материалы, режим, размер,</tspan>
<tspan x="658" dy="17.5">отступ -&gt; новые UV, тайлы UDIM, ячейки; ошибка —</tspan>
<tspan x="658" dy="17.5">AtlasError</tspan>
<tspan x="658" dy="17.5">atlas_png: раскладка -&gt; PNG атласа</tspan>
<tspan x="658" dy="17.5">flora_layout: вырезки текстур, max размер, отступ -&gt;</tspan>
<tspan x="658" dy="17.5">раскладка атласа флоры</tspan>
</text>
<text x="658" y="698.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="658" dy="12">Дубли вне владельца: 5</tspan>
</text>
<text x="1268" y="471.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268" dy="14">Экспорт и пакет сдачи</tspan>
<tspan x="1268" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="1268" dy="17.5">единственный писатель ZIP сдачи (_write_zip): agr</tspan>
<tspan x="1268" dy="17.5">package-npm / package-vpm (tools/derive) и AGR Tools</tspan>
<tspan x="1268" dy="17.5">(#1361, #1377)</tspan>
<tspan x="1268" dy="17.5"></tspan>
<tspan x="1268" dy="17.5">zip_plan: папка, [адрес], [лимиты] -&gt; архивы НПМ/ВПМ и</tspan>
<tspan x="1268" dy="17.5">пропуски с причиной; файлы не трогает</tspan>
<tspan x="1268" dy="17.5">check_members: члены архива -&gt; плоские безопасные имена;</tspan>
<tspan x="1268" dy="17.5">плохое имя — ошибка до записи</tspan>
<tspan x="1268" dy="17.5">_write_zip: папка, архив, цель -&gt; новый ZIP через</tspan>
<tspan x="1268" dy="17.5">.partial без перезаписи; дубль, пустой вход, изменение во</tspan>
<tspan x="1268" dy="17.5">время упаковки — ошибка</tspan>
<tspan x="1268" dy="17.5">zip_apply: предпросмотр -&gt; новая папка Сборка_&lt;время&gt;,</tspan>
<tspan x="1268" dy="17.5">ZIP + проверка; ГОТОВО.txt только без провалов</tspan>
</text>
<text x="1268" y="768.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="1268" dy="12">Дубли вне владельца: 23</tspan>
<tspan x="1268" dy="15.0">Правило проверки: свой писатель ZIP вместо общего _write_zip;</tspan>
<tspan x="1268" dy="15.0">охрана jobs/, tools/, src/ (#1377)</tspan>
</text>
<text x="1878" y="471.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1878" dy="14">Проверка и приёмка</tspan>
<tspan x="1878" dy="17.5">Владелец: tools/qa/validate_package.py</tspan>
<tspan x="1878" dy="17.5">проверка пакета по регламенту (agr validate)</tspan>
<tspan x="1878" dy="17.5"></tspan>
<tspan x="1878" dy="17.5">validate_vpm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="1878" dy="17.5">находки ВПМ и плотность V009</tspan>
<tspan x="1878" dy="17.5">validate_npm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="1878" dy="17.5">находки НПМ</tspan>
<tspan x="1878" dy="17.5">main: путь к ZIP/FBX, --profile, --scene, --master,</tspan>
<tspan x="1878" dy="17.5">--json -&gt; отчёт; провал — ненулевой код</tspan>
</text>
<text x="1878" y="680.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="1878" dy="12">Дубли вне владельца: 5</tspan>
</text>
<text x="963.0" y="893.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Связь с DCC (Blender / 3ds Max)</tspan>
<tspan x="963.0" dy="17.5">Владелец: src/dt_ai/core/blender_runner.py</tspan>
<tspan x="963.0" dy="17.5">запуск Blender без окна со свежим JSON-ответом</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">blender_executable: путь или DT_BLENDER -&gt; исполняемый</tspan>
<tspan x="963.0" dy="17.5">файл Blender; нет — ошибка</tspan>
<tspan x="963.0" dy="17.5">blender_command: скрипт, аргументы -&gt; одна командная</tspan>
<tspan x="963.0" dy="17.5">строка Blender без окна (закреплённая версия, без</tspan>
<tspan x="963.0" dy="17.5">автозапуска)</tspan>
<tspan x="963.0" dy="17.5">run_blender: скрипт, аргументы, ожидаемые выходы, таймаут</tspan>
<tspan x="963.0" dy="17.5">-&gt; свежий JSON; старый ответ — ошибка</tspan>
</text>
<text x="963.0" y="1119.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="12">Дубли вне владельца: 24</tspan>
<tspan x="963.0" dy="15.0">Правило проверки: своя командная строка Blender (--background +</tspan>
<tspan x="963.0" dy="15.0">--python) вместо общего blender_command / run_blender; охрана</tspan>
<tspan x="963.0" dy="15.0">jobs/, tools/, src/ (#1378)</tspan>
</text>
