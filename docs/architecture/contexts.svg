<tspan x="1495.0" dy="14">UV, атлас,</tspan>
<tspan x="1495.0" dy="17.5">текстуры</tspan>
</text>
<rect x="2025.0" y="659.0" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="2055.0" y="659.0" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="2055.0" dy="14">ZIP / FBX сдачи</tspan>
</text>
<rect x="905.0" y="658.5" width="60" height="35.0" fill="#ffffff" opacity="0.9"/>
<text x="935.0" y="658.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="935.0" dy="14">Blender/Max</tspan>
<tspan x="935.0" dy="17.5">строит</tspan>
</text>
<rect x="2025.0" y="650.0" width="60" height="35.0" fill="#ffffff" opacity="0.9"/>
<text x="2055.0" y="650.0" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="2055.0" dy="14">свежее чтение</tspan>
<tspan x="2055.0" dy="17.5">экспорта</tspan>
</text>
<rect x="1262.5" y="432.5" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1292.5" y="432.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1292.5" dy="14">номер тайла</tspan>
</text>
<rect x="1872.5" y="432.5" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1902.5" y="432.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1902.5" dy="14">номер тайла</tspan>
</text>
