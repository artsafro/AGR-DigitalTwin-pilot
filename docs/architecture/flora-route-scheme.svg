<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут Флоры (НПМ + ВПМ) — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: 8df4205a6cd7a8862b1b4c27c2276a3171bad54aa090a6849628936dfe8677f9</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: Ведомость озеленения и СПОЗУ: ревизия, SHA-256, виды, размеры и точки в реестре исходников</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 19; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Прочитать ведомость и выбрать виды</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Виды и количество сверены с проектом</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Список видов, клумб и библиотечных</tspan>
<tspan x="845.0" dy="20.0">кандидатов</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Подготовить размеры, карты и версии растений</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Копии LOD не изменяют библиотечный</tspan>
<tspan x="260.0" dy="20.0">оригинал</tspan>
</text>
<text x="845.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: НПМ-звёзды / оболочки ВПМ; временные</tspan>
<tspan x="845.0" dy="20.0">замены отмечены</tspan>
</text>
<text x="260.0" y="635.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Расставить растения и собрать атласы</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Сид и варианты записаны</tspan>
</text>
<text x="845.0" y="635.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: НПМ / ВПМ в общих точках и разные атласы</tspan>
<tspan x="845.0" dy="20.0">профилей</tspan>
</text>
<text x="260.0" y="760.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Проверить экспорт и показать виды</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Артём проверяет виды и временные замены</tspan>
</text>
<text x="845.0" y="760.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Отчёт FLO, лист видов и расстановка</tspan>
</text>
<text x="260.0" y="885.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Передать в Ground и на упаковку</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Приёмка пакета отдельно от списка видов</tspan>
</text>
<text x="845.0" y="885.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Ground FBX → схема «Пакет и сдача»</tspan>
</text>
