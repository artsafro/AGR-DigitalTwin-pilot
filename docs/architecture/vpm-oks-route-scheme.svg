<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут ВПМ / ОКС v2 — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: 38fe22575a383e9435c4748f7d84751829996e6bbd45d4bff1f2ac78ae3ef815</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: КПП1: Revit / DWG / PDF, ревизия и SHA-256 в реестре исходников; неизвестное — остановка</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 33; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Описать исходники и согласовать состав</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Артём подтвердил Gate 1</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Реестр исходников + PartsList + бюджет</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Построить корпус, окна, кровлю и декор</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Архитектура сверена с проектом</tspan>
</text>
<text x="845.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Сцена ВПМ или мастер</tspan>
</text>
<text x="260.0" y="615.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Подготовить UV / UDIM, UCX и НПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Профили и атлас не подменяют друг друга</tspan>
</text>
<text x="845.0" y="615.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: ВПМ + НПМ в общих координатах</tspan>
</text>
<text x="260.0" y="740.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Экспортировать и упаковать</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Упаковка не означает приёмку</tspan>
</text>
<text x="845.0" y="740.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: FBX + export_meta + ZIP; схема «Пакет и</tspan>
<tspan x="845.0" dy="20.0">сдача»</tspan>
</text>
<text x="260.0" y="865.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Прочитать экспорт и выполнить проверки</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Отказ / not_run не равны pass</tspan>
</text>
<text x="845.0" y="865.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Свежий отчёт и находки СИНТЕЗ</tspan>
</text>
<text x="260.0" y="990.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">6. Передать результат Артёму</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Артём принимает визуально; публикация</tspan>
<tspan x="260.0" dy="20.0">отдельно</tspan>
</text>
<text x="845.0" y="990.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Пакет и сцена Max QUAD</tspan>
</text>
