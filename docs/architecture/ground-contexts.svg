<text x="40" y="0" font-size="28" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="28">Карта контекстов маршрута Ground (НПМ + ВПМ) — D293 (#1392)</tspan>
</text>
<text x="40" y="44" font-size="16" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="16">Легенда: зелёный — модуль-владелец и его функции (контракт: вход -&gt; выход); жёлтый — общее ядро; розовый — число записей вне владельца (адреса в таблице владельцев); стрелки — передача между владельцами</tspan>
</text>
<text x="963.0" y="120.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Общее ядро: номер тайла UDIM (UDIM = ID покрытия)</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/udimtile_core.py</tspan>
<tspan x="963.0" dy="17.5">одна функция UDIM (#1337); её дубли охраняет карта НПМ</tspan>
<tspan x="963.0" dy="17.5">(contexts.yaml)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">udim_tile: u, v -&gt; номер тайла 1001 + ⌊u⌋ + 10·⌊v⌋; вне</tspan>
<tspan x="963.0" dy="17.5">области — UdimDomainError</tspan>
<tspan x="963.0" dy="17.5">face_tile: углы UV грани -&gt; тайл грани; угол в чужом</tspan>
<tspan x="963.0" dy="17.5">тайле — UdimCrossTileError</tspan>
</text>
<text x="48.0" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="14">Связь с DCC (Blender / 3ds Max / AGR Tools)</tspan>
<tspan x="48.0" dy="17.5">Владелец: src/dt_ai/core/blender_runner.py</tspan>
<tspan x="48.0" dy="17.5">исходники DWG / ПЗУ / PDF / 3D-рельеф; агент работает</tspan>
<tspan x="48.0" dy="17.5">там, где удобно (D293)</tspan>
<tspan x="48.0" dy="17.5"></tspan>
<tspan x="48.0" dy="17.5">blender_executable: путь или DT_BLENDER -&gt; исполняемый</tspan>
<tspan x="48.0" dy="17.5">файл Blender; нет — ошибка</tspan>
<tspan x="48.0" dy="17.5">run_blender: скрипт, аргументы, ожидаемые выходы, таймаут</tspan>
<tspan x="48.0" dy="17.5">-&gt; свежий JSON; старый ответ — ошибка</tspan>
</text>
<text x="658.0" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Граница участка и нулевая отметка</tspan>
<tspan x="658.0" dy="17.5">Владелец: src/dt_ai/core/heights.py</tspan>
<tspan x="658.0" dy="17.5">высоты App.3 от нуля проекта (D279); граница и ноль — из</tspan>
<tspan x="658.0" dy="17.5">проекта или агент уточняет (D293)</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">height_values: ноль проекта, м; Z нуля в FBX, м; верх</tspan>
<tspan x="658.0" dy="17.5">модели, м -&gt; высоты App.3 с округлением только в конце</tspan>
</text>
<text x="1268.0" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="14">Поверхность Ground: плоские покрытия → проекция на рельеф</tspan>
<tspan x="1268.0" dy="17.5">→ юбка</tspan>
<tspan x="1268.0" dy="17.5">Владелец: tools/ground/build_ground_v015.py</tspan>
<tspan x="1268.0" dy="17.5">сборка Ground Ватутино v015 (только этот участок, agr</tspan>
<tspan x="1268.0" dy="17.5">ground / dt ground v015)</tspan>
<tspan x="1268.0" dy="17.5"></tspan>
<tspan x="1268.0" dy="17.5">geometry: данные участка, исходник, одобрения, вырезы -&gt;</tspan>
<tspan x="1268.0" dy="17.5">меш Ground v015</tspan>
<tspan x="1268.0" dy="17.5">restore_source_coverage: меш, план -&gt; ограниченный ремонт</tspan>
<tspan x="1268.0" dy="17.5">покрытия; ненулевой остаток не прощается</tspan>
<tspan x="1268.0" dy="17.5">derive: меш, профиль, сэмплер, защищённые, исключения -&gt;</tspan>
<tspan x="1268.0" dy="17.5">квады и треугольники Ground</tspan>
<tspan x="1268.0" dy="17.5">main: --job-dir и параметры -&gt; Ground v015 и отчёт;</tspan>
<tspan x="1268.0" dy="17.5">изменился HEAD — отказ</tspan>
</text>
<text x="1878.0" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1878.0" dy="14">Текстуры по ID: UV-острова, тайлы, UDIM / атлас</tspan>
<tspan x="1878.0" dy="17.5">Владелец: adapters/max/agr_tools/atlas_core.py</tspan>
<tspan x="1878.0" dy="17.5">ВПМ: UDIM = ID; НПМ: та же геометрия на атласе (D293);</tspan>
<tspan x="1878.0" dy="17.5">упаковка атласа (D225)</tspan>
<tspan x="1878.0" dy="17.5"></tspan>
<tspan x="1878.0" dy="17.5">pack: вершины, UV, грани, материалы, режим, размер,</tspan>
<tspan x="1878.0" dy="17.5">отступ -&gt; новые UV, тайлы UDIM, ячейки</tspan>
<tspan x="1878.0" dy="17.5">atlas_png: раскладка -&gt; PNG атласа</tspan>
</text>
<text x="1268.0" y="682.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="14">НПМ МАФ и Флора на атласе</tspan>
<tspan x="1268.0" dy="17.5">Владелец: adapters/max/agr_tools/flora_atlas_max.py</tspan>
<tspan x="1268.0" dy="17.5">атлас МАФ (GroundEl) и Флоры в AGR Tools; конвертация ВПМ</tspan>
<tspan x="1268.0" dy="17.5">→ НПМ или параллельно (D293)</tspan>
<tspan x="1268.0" dy="17.5"></tspan>
<tspan x="1268.0" dy="17.5">atlas_groundel: контекст Max, режим, узлы МАФ, превью -&gt;</tspan>
<tspan x="1268.0" dy="17.5">атлас МАФ НПМ</tspan>
<tspan x="1268.0" dy="17.5">atlas_flora: контекст Max, режим, узлы Флоры, превью -&gt;</tspan>
<tspan x="1268.0" dy="17.5">атлас Флоры НПМ</tspan>
</text>
<text x="658.0" y="682.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Расстановка МАФ и Флоры</tspan>
<tspan x="658.0" dy="17.5">Владелец: src/dt_ai/placement/engine.py</tspan>
<tspan x="658.0" dy="17.5">один экземпляр на точку СПОЗУ по высоте Ground; low-poly</tspan>
<tspan x="658.0" dy="17.5">и high-poly — в одни точки (D293)</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">place: точки, вершины и треугольники Ground, библиотека,</tspan>
<tspan x="658.0" dy="17.5">seed -&gt; экземпляр или отказ с кодом</tspan>
<tspan x="658.0" dy="17.5">bottom_face_verdict: нижняя грань в мире -&gt; удалить / на</tspan>
<tspan x="658.0" dy="17.5">проверку (D095, D096)</tspan>
<tspan x="658.0" dy="17.5">report_json: отчёт -&gt; строгий JSON: тот же seed и вход -&gt;</tspan>
<tspan x="658.0" dy="17.5">те же байты</tspan>
</text>
<text x="658.0" y="909.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="12">Дубли вне владельца: 1</tspan>
</text>
<text x="1268.0" y="1004.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="14">Экспорт и пакеты НПМ / ВПМ</tspan>
<tspan x="1268.0" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="1268.0" dy="17.5">единственный писатель ZIP сдачи (_write_zip): agr</tspan>
<tspan x="1268.0" dy="17.5">package-npm / package-vpm (tools/derive) и AGR Tools</tspan>
<tspan x="1268.0" dy="17.5">(#1361, #1377)</tspan>
<tspan x="1268.0" dy="17.5"></tspan>
<tspan x="1268.0" dy="17.5">zip_plan: папка, [адрес], [лимиты] -&gt; архивы НПМ/ВПМ и</tspan>
<tspan x="1268.0" dy="17.5">пропуски с причиной; файлы не трогает</tspan>
<tspan x="1268.0" dy="17.5">check_members: члены архива -&gt; плоские безопасные имена;</tspan>
<tspan x="1268.0" dy="17.5">плохое имя — ошибка до записи</tspan>
<tspan x="1268.0" dy="17.5">_write_zip: папка, архив, цель -&gt; новый ZIP через</tspan>
<tspan x="1268.0" dy="17.5">.partial без перезаписи; дубль, пустой вход, изменение во</tspan>
<tspan x="1268.0" dy="17.5">время упаковки — ошибка</tspan>
<tspan x="1268.0" dy="17.5">zip_apply: предпросмотр -&gt; новая папка Сборка_&lt;время&gt;,</tspan>
<tspan x="1268.0" dy="17.5">ZIP + проверка; ГОТОВО.txt только без провалов</tspan>
</text>
<text x="1878.0" y="1004.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1878.0" dy="14">Коллизии UCX рельефа (только ВПМ)</tspan>
<tspan x="1878.0" dy="17.5">Владелец: adapters/max/agr_tools/ucx10_core.py</tspan>
<tspan x="1878.0" dy="17.5">зазоры UCX (D325: ядро на функцию); строит</tspan>
<tspan x="1878.0" dy="17.5">src/dt_ai/geometry/ucx_build.py; команда agr ucx (#1404)</tspan>
<tspan x="1878.0" dy="17.5"></tspan>
<tspan x="1878.0" dy="17.5">piece: вершины, треугольники -&gt; выпуклый кусок с</tspan>
<tspan x="1878.0" dy="17.5">нормалями и рёбрами</tspan>
<tspan x="1878.0" dy="17.5">plan: куски, опции -&gt; зазор каждой соседней пары каждого</tspan>
<tspan x="1878.0" dy="17.5">семейства UCX</tspan>
</text>
<text x="1878.0" y="1195.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="1878.0" dy="12">Дубли вне владельца: 1</tspan>
</text>
<text x="1268.0" y="1346.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="14">Проверки Ground, xView, СИНТЕЗ</tspan>
<tspan x="1268.0" dy="17.5">Владелец: tools/qa/validate_package.py</tspan>
<tspan x="1268.0" dy="17.5">проверка пакета по регламенту (agr validate)</tspan>
<tspan x="1268.0" dy="17.5"></tspan>
<tspan x="1268.0" dy="17.5">validate_vpm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="1268.0" dy="17.5">находки ВПМ</tspan>
<tspan x="1268.0" dy="17.5">validate_npm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="1268.0" dy="17.5">находки НПМ</tspan>
</text>
