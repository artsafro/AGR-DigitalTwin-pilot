<tspan x="2045.0" dy="17.5">оболочка</tspan>
</text>
<rect x="1415.0" y="449.12" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1445.0" y="449.12" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1445.0" dy="14">точки Флоры</tspan>
</text>
<rect x="1110.0" y="791.0" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1140.0" y="791.0" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1140.0" dy="14">облегчённые НПМ</tspan>
</text>
<rect x="1720.0" y="863.5" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1750.0" y="863.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1750.0" dy="14">виды сцены</tspan>
</text>
<rect x="2025.0" y="1147.88" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="2055.0" y="1147.88" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="2055.0" dy="14">карты и размеры</tspan>
</text>
<rect x="1770.0" y="1054.5" width="60" height="35.0" fill="#ffffff" opacity="0.9"/>
<text x="1800.0" y="1054.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1800.0" dy="14">атлас 2048 /</tspan>
