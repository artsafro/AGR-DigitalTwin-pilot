<text x="40" y="0" font-size="28" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="28">Карта контекстов маршрута Флоры (НПМ + ВПМ) — D293 (#1393)</tspan>
</text>
<text x="40" y="44" font-size="16" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="16">Легенда: зелёный — модуль-владелец и его функции (контракт: вход -&gt; выход); жёлтый — общее ядро; розовый — число записей вне владельца (адреса в таблице владельцев); стрелки — передача между владельцами</tspan>
</text>
<text x="963.0" y="120.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Общее ядро: расстановка МАФ и Флоры (общая с Ground и</tspan>
<tspan x="963.0" dy="17.5">МАФ)</tspan>
<tspan x="963.0" dy="17.5">Владелец: src/dt_ai/placement/engine.py</tspan>
<tspan x="963.0" dy="17.5">точка СПОЗУ без поворота, утопление 10 см, поворот Z и</tspan>
<tspan x="963.0" dy="17.5">масштаб ±10 % (D100); НПМ и ВПМ — в одни точки (D293)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">place: точки, вершины и треугольники Ground, библиотека,</tspan>
<tspan x="963.0" dy="17.5">seed -&gt; экземпляр или отказ с кодом</tspan>
<tspan x="963.0" dy="17.5">report_json: отчёт -&gt; строгий JSON: тот же seed и вход -&gt;</tspan>
<tspan x="963.0" dy="17.5">те же байты</tspan>
</text>
<text x="48.0" y="375.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="14">Связь с DCC (Blender / 3ds Max / AGR Tools)</tspan>
<tspan x="48.0" dy="17.5">Владелец: src/dt_ai/core/blender_runner.py</tspan>
<tspan x="48.0" dy="17.5">ведомость, DWG СПОЗУ, сцена библиотеки — только копии;</tspan>
<tspan x="48.0" dy="17.5">агент работает там, где удобно (D293)</tspan>
<tspan x="48.0" dy="17.5"></tspan>
<tspan x="48.0" dy="17.5">blender_executable: путь или DT_BLENDER -&gt; исполняемый</tspan>
<tspan x="48.0" dy="17.5">файл Blender; нет — ошибка</tspan>
<tspan x="48.0" dy="17.5">run_blender: скрипт, аргументы, ожидаемые выходы, таймаут</tspan>
<tspan x="48.0" dy="17.5">-&gt; свежий JSON; старый ответ — ошибка</tspan>
</text>
<text x="658.0" y="375.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Библиотека Флоры: каталог v003, A101, карты</tspan>
<tspan x="658.0" dy="17.5">Владелец: src/dt_ai/materials/flora_catalogue.py</tspan>
<tspan x="658.0" dy="17.5">замороженный каталог v003 (G:/Мой диск/AGR-assets/flora);</tspan>
<tspan x="658.0" dy="17.5">правится species-curation.json, не каталог</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">build: аудит, курирование, карты, прошлый каталог -&gt;</tspan>
<tspan x="658.0" dy="17.5">catalogue.json</tspan>
<tspan x="658.0" dy="17.5">check: каталог -&gt; находки схемы и ID материалов; пусто =</tspan>
<tspan x="658.0" dy="17.5">OK</tspan>
</text>
<text x="1573.0" y="375.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1573.0" dy="14">Карты вида: одобренные, stand-in, новые</tspan>
<tspan x="1573.0" dy="17.5">Владелец: src/dt_ai/materials/flora.py</tspan>
<tspan x="1573.0" dy="17.5">маршрут карт: план -&gt; вырезка -&gt; лист на проверку -&gt; в</tspan>
<tspan x="1573.0" dy="17.5">библиотеку только после одобрения</tspan>
<tspan x="1573.0" dy="17.5"></tspan>
<tspan x="1573.0" dy="17.5">make_plan: виды -&gt; план генерации карт</tspan>
<tspan x="1573.0" dy="17.5">cutout: картинка, порог -&gt; диффуз RGB и строго ч/б</tspan>
<tspan x="1573.0" dy="17.5">прозрачность, без альфы</tspan>
<tspan x="1573.0" dy="17.5">publish_library: лист проверки, одобрения, выход -&gt; копия</tspan>
<tspan x="1573.0" dy="17.5">одобренных карт байт в байт; ничего не перезаписывает</tspan>
</text>
<text x="2183.0" y="375.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="2183.0" dy="14">НПМ-звезда и ВПМ-оболочка</tspan>
<tspan x="2183.0" dy="17.5">Владелец: tools/flora/build_flora_star.py</tspan>
<tspan x="2183.0" dy="17.5">звезда из плоскостей с картой (D102); ВПМ — оболочка</tspan>
<tspan x="2183.0" dy="17.5">каждой плоскости в своём тайле</tspan>
<tspan x="2183.0" dy="17.5"></tspan>
<tspan x="2183.0" dy="17.5">star_mesh: тип, высота, рамка растения, поле -&gt; вершины,</tspan>
<tspan x="2183.0" dy="17.5">треугольники, UV звезды НПМ</tspan>
<tspan x="2183.0" dy="17.5">vpm_shell: звезда НПМ, тайл, толщина -&gt; замкнутая</tspan>
<tspan x="2183.0" dy="17.5">оболочка на плоскость</tspan>
<tspan x="2183.0" dy="17.5">build_species: вид {ключ, лат, тип, высота, диапазон,</tspan>
<tspan x="2183.0" dy="17.5">карты, ID} -&gt; НПМ + ВПМ вида</tspan>
</text>
<text x="353.0" y="647.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="353.0" dy="14">Облегчённые НПМ (LOD) — только на копии</tspan>
<tspan x="353.0" dy="17.5">Владелец: tools/flora/build_flora_npm_light.py</tspan>
<tspan x="353.0" dy="17.5">копия v003 -&gt; подмножество неизменных треугольников;</tspan>
<tspan x="353.0" dy="17.5">оригиналы хешируются до и после (#347)</tspan>
<tspan x="353.0" dy="17.5"></tspan>
<tspan x="353.0" dy="17.5">execute: рабочая папка, исходные сцены -&gt; облегчённые</tspan>
<tspan x="353.0" dy="17.5">варианты; занятая папка — отказ</tspan>
<tspan x="353.0" dy="17.5">max_stage: задание -&gt; шаг 3ds Max на копии</tspan>
<tspan x="353.0" dy="17.5">blender_stage: задание -&gt; независимое чтение FBX в</tspan>
<tspan x="353.0" dy="17.5">Blender</tspan>
</text>
<text x="963.0" y="647.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">НПМ Флоры на атласе</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/flora_atlas_max.py</tspan>
<tspan x="963.0" dy="17.5">атлас Флоры в AGR Tools; конвертация ВПМ → НПМ или</tspan>
<tspan x="963.0" dy="17.5">параллельно (D293)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">atlas_flora: контекст Max, режим, узлы Флоры, превью -&gt;</tspan>
<tspan x="963.0" dy="17.5">атлас Флоры НПМ</tspan>
</text>
<text x="1573.0" y="902.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1573.0" dy="14">Атлас Флоры из расставленной сцены</tspan>
<tspan x="1573.0" dy="17.5">Владелец: tools/library/flora_atlas_from_scene.py</tspan>
<tspan x="1573.0" dy="17.5">НПМ — один 2048 на участок, второго атласа нет; ВПМ —</tspan>
<tspan x="1573.0" dy="17.5">свой 4096 (D246)</tspan>
<tspan x="1573.0" dy="17.5"></tspan>
<tspan x="1573.0" dy="17.5">build_atlas: сцена JSON, каталог -&gt; один атлас на виды</tspan>
<tspan x="1573.0" dy="17.5">сцены + отчёт</tspan>
<tspan x="1573.0" dy="17.5">remap_uv: UV, тайл -&gt; UV внутри тайла вида с той же</tspan>
<tspan x="1573.0" dy="17.5">раскладкой</tspan>
</text>
<text x="963.0" y="902.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Экспорт и пакеты (Флора в Ground FBX)</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="963.0" dy="17.5">единственный писатель ZIP сдачи (_write_zip): agr</tspan>
<tspan x="963.0" dy="17.5">package-npm / package-vpm (tools/derive) и AGR Tools</tspan>
<tspan x="963.0" dy="17.5">(#1361, #1377)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">zip_plan: папка, [адрес], [лимиты] -&gt; архивы НПМ/ВПМ и</tspan>
<tspan x="963.0" dy="17.5">пропуски с причиной; файлы не трогает</tspan>
<tspan x="963.0" dy="17.5">check_members: члены архива -&gt; плоские безопасные имена;</tspan>
<tspan x="963.0" dy="17.5">плохое имя — ошибка до записи</tspan>
<tspan x="963.0" dy="17.5">_write_zip: папка, архив, цель -&gt; новый ZIP через</tspan>
<tspan x="963.0" dy="17.5">.partial без перезаписи; дубль, пустой вход, изменение во</tspan>
<tspan x="963.0" dy="17.5">время упаковки — ошибка</tspan>
<tspan x="963.0" dy="17.5">zip_apply: предпросмотр -&gt; новая папка Сборка_&lt;время&gt;,</tspan>
<tspan x="963.0" dy="17.5">ZIP + проверка; ГОТОВО.txt только без провалов</tspan>
</text>
<text x="353.0" y="902.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="353.0" dy="14">Проверки пакета и визуальный шлюз</tspan>
<tspan x="353.0" dy="17.5">Владелец: tools/qa/validate_package.py</tspan>
<tspan x="353.0" dy="17.5">проверка пакета по регламенту (agr validate)</tspan>
<tspan x="353.0" dy="17.5"></tspan>
<tspan x="353.0" dy="17.5">validate_vpm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="353.0" dy="17.5">находки ВПМ</tspan>
<tspan x="353.0" dy="17.5">validate_npm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="353.0" dy="17.5">находки НПМ</tspan>
</text>
<text x="1573.0" y="1245.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1573.0" dy="14">Проверки Флоры: размер, доля бюджета, карты</tspan>
<tspan x="1573.0" dy="17.5">Владелец: src/twinqa/flora.py</tspan>
<tspan x="1573.0" dy="17.5">FLO-04, FLO-06, FLO-08 на чтении Ground FBX</tspan>
<tspan x="1573.0" dy="17.5"></tspan>
<tspan x="1573.0" dy="17.5">dimension_findings: меши, ведомость {меш: высота, крона}</tspan>
<tspan x="1573.0" dy="17.5">-&gt; находки ±20 % (D099)</tspan>
<tspan x="1573.0" dy="17.5">budget_finding: меши, итог Ground, предел, доля -&gt;</tspan>
<tspan x="1573.0" dy="17.5">находка доли Флоры (70 000, D097)</tspan>
<tspan x="1573.0" dy="17.5">map_findings: чтение, меши Флоры -&gt; НПМ: диффуз +</tspan>
<tspan x="1573.0" dy="17.5">отдельная прозрачность, больше ничего</tspan>
</text>
