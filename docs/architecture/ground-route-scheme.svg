<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут Ground (НПМ + ВПМ) v2 — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: 033b85de7c82d697096f985304948dab39e65455bd7964d89d9876390f1b77bf</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: DWG / ПЗУ / PDF и рельеф: ревизия, SHA-256 и проектный ноль в реестре исходников</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 5; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Прочитать участок и определить ноль</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Неизвестные отметки уточняются, не</tspan>
<tspan x="260.0" dy="20.0">угадываются</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Граница, покрытия, отметки и реестр</tspan>
<tspan x="845.0" dy="20.0">исходников</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="510.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Собрать плоский Ground и текстуры по ID</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Покрытия сверены с легендой проекта</tspan>
</text>
<text x="845.0" y="510.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Поверхности с UV / UDIM и материалами</tspan>
</text>
<text x="260.0" y="635.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Спроецировать рельеф, добавить юбку и UCX ВПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Швы и юбка проверены</tspan>
</text>
<text x="845.0" y="635.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Рельеф и коллизии ВПМ</tspan>
</text>
<text x="260.0" y="760.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Расставить МАФ / Флору и получить НПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Расстановка по СПОЗУ, пропуски видны в</tspan>
<tspan x="260.0" dy="20.0">отчёте</tspan>
</text>
<text x="845.0" y="760.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Сцены НПМ / ВПМ + список удалённых</tspan>
<tspan x="845.0" dy="20.0">объектов с причинами</tspan>
</text>
<text x="260.0" y="905.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Экспортировать и упаковать</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Упаковка не означает приёмку</tspan>
</text>
<text x="845.0" y="905.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Ground FBX и ZIP; схема «Пакет и сдача»</tspan>
</text>
<text x="260.0" y="1030.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">6. Проверить Ground и передать Артёму</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Отказы не скрыты; визуальная приёмка — в</tspan>
<tspan x="260.0" dy="20.0">маршруте сдачи</tspan>
</text>
<text x="845.0" y="1030.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Отчёт, xView и находки СИНТЕЗ</tspan>
</text>
