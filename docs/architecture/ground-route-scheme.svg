<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут Ground (НПМ + ВПМ) — целевой порядок D293 — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: ef7ccd084dff5048c5bab876b6d180135c8dc9cee56f875d4bab25342431173b</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: DWG / ПЗУ / PDF и рельеф: ревизия, SHA-256 и проектный ноль в реестре исходников</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 4; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Сверить покрытия с легендой, взять границу и</tspan>
<tspan x="260.0" dy="20.0">ноль из проекта</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Ноль уточнить, если не указан; agr</tspan>
<tspan x="260.0" dy="20.0">inspect читает манифест, agr zero проверяет OBJ</tspan>
<tspan x="260.0" dy="20.0">по заданному нулю</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Граница, покрытия, отметки и реестр</tspan>
<tspan x="845.0" dy="20.0">исходников</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="550.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Собрать плоский Ground, назначить UV / UDIM до</tspan>
<tspan x="260.0" dy="20.0">проекции</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Покрытия сверены с легендой проекта</tspan>
</text>
<text x="845.0" y="550.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: ground-flat.obj — треугольники с UV, без</tspan>
<tspan x="845.0" dy="20.0">файлов текстур</tspan>
</text>
<text x="260.0" y="695.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Спроецировать Ground, обработать UV юбки;</tspan>
<tspan x="260.0" dy="20.0">отдельно построить UCX ВПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Прямого перехода от OBJ к agr ucx нет в</tspan>
<tspan x="260.0" dy="20.0">общем маршруте; швы и юбку проверить</tspan>
</text>
<text x="845.0" y="695.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: SM_&lt;site&gt;_Ground.obj и</tspan>
<tspan x="845.0" dy="20.0">ground-report.json; UCX отдельно (вход FBX /</tspan>
<tspan x="845.0" dy="20.0">Blend)</tspan>
</text>
<text x="260.0" y="860.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Расставить МАФ / Флору и получить НПМ</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Расстановка (dt_ai.placement): master</tspan>
<tspan x="260.0" dy="20.0">JSON + (offset или readback) + (FBX или mesh), не</tspan>
<tspan x="260.0" dy="20.0">OBJ сборщика; цель D302 vs команда — только</tspan>
<tspan x="260.0" dy="20.0">одобренные исключения по точке и sha256 Ground</tspan>
<tspan x="260.0" dy="20.0">пропускаются, новый промах останавливает прогон</tspan>
<tspan x="260.0" dy="20.0">до инстансирования; agr vpm-to-npm не</tspan>
<tspan x="260.0" dy="20.0">конвертирует Ground</tspan>
</text>
<text x="845.0" y="860.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Сцены НПМ / ВПМ, engine_report.json и</tspan>
<tspan x="845.0" dy="20.0">results.json (список excluded с причинами /</tspan>
<tspan x="845.0" dy="20.0">stopped)</tspan>
</text>
<text x="260.0" y="1105.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Экспортировать НПМ / ВПМ отдельно от упаковки</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Blender Ground JSON-to-FBX читает</tspan>
<tspan x="260.0" dy="20.0">JSON-мастер, не OBJ сборщика</tspan>
</text>
<text x="845.0" y="1105.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Ground FBX сдачи и рабочий FBX с квадами</tspan>
<tspan x="845.0" dy="20.0">(D366)</tspan>
</text>
<text x="260.0" y="1250.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">6. Упаковать готовые файлы</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Упаковка не означает приёмку</tspan>
</text>
<text x="845.0" y="1250.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: ZIP; схема «Пакет и сдача»</tspan>
</text>
<text x="260.0" y="1375.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">7. Проверить Ground и передать Артёму</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Отказы не скрыты; визуальная приёмка — в</tspan>
<tspan x="260.0" dy="20.0">маршруте сдачи</tspan>
</text>
<text x="845.0" y="1375.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Отчёт, xView и находки СИНТЕЗ</tspan>
</text>
</svg>
