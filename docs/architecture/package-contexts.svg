<tspan x="1342.5" dy="14">FBX + факты</tspan>
</text>
<rect x="1312.5" y="581.0" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1342.5" y="581.0" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1342.5" dy="14">свежее чтение</tspan>
</text>
<rect x="1465.0" y="580.75" width="60" height="35.0" fill="#ffffff" opacity="0.9"/>
<text x="1495.0" y="580.75" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1495.0" dy="14">адрес, верх,</tspan>
<tspan x="1495.0" dy="17.5">превью</tspan>
</text>
<rect x="855.0" y="708.5" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="885.0" y="708.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="885.0" dy="14">GeoJSON ВПМ</tspan>
</text>
<rect x="1160.0" y="462.25" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1190.0" y="462.25" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1190.0" dy="14">запись ZIP</tspan>
</text>
<rect x="1465.0" y="717.25" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1495.0" y="717.25" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1495.0" dy="14">ZIP сдачи</tspan>
</text>
<rect x="1160.0" y="915.0" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1190.0" y="915.0" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1190.0" dy="14">те же ZIP</tspan>
</text>
</svg>
