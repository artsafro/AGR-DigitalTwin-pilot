<text x="40" y="0" font-size="28" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="28">Карта контекстов маршрута «Пакет и сдача» (НПМ + ВПМ) — #1361, D293 (#1393)</tspan>
</text>
<text x="40" y="44" font-size="16" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="16">Легенда: зелёный — модуль-владелец и его функции (контракт: вход -&gt; выход); жёлтый — общее ядро; розовый — число записей вне владельца (адреса в таблице владельцев); стрелки — передача между владельцами</tspan>
</text>
<text x="963.0" y="120.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Общее ядро: один писатель ZIP для AGR Tools и обоих</tspan>
<tspan x="963.0" dy="17.5">упаковщиков</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="963.0" dy="17.5">план архивов, отказ при дублях / пустых членах /</tspan>
<tspan x="963.0" dy="17.5">несовпадении снимка; чужие файлы не удаляет (#1361)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">zip_plan: папка, адрес, пределы -&gt; архивы для записи +</tspan>
<tspan x="963.0" dy="17.5">пропуски с причинами; файлы не трогает</tspan>
</text>
<text x="48.0" y="340.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="14">Связь с DCC и приёмка (сцена в 3ds Max)</tspan>
<tspan x="48.0" dy="17.5">Владелец: src/dt_ai/core/blender_runner.py</tspan>
<tspan x="48.0" dy="17.5">запуск Blender (D212); приёмку делает Артём вручную по</tspan>
<tspan x="48.0" dy="17.5">сцене Max QUAD + пути (D270), владельца в коде у неё нет</tspan>
<tspan x="48.0" dy="17.5"></tspan>
<tspan x="48.0" dy="17.5">blender_executable: --blender &gt; DT_BLENDER (CLI dt qa /</tspan>
<tspan x="48.0" dy="17.5">agr) &gt; TWINQA_BLENDER (blender_runner) &gt; установка 5.1.2;</tspan>
<tspan x="48.0" dy="17.5">путь к Blender</tspan>
<tspan x="48.0" dy="17.5">run_blender: скрипт, аргументы, ожидаемые выходы, таймаут</tspan>
<tspan x="48.0" dy="17.5">-&gt; свежий JSON; старый ответ — ошибка</tspan>
</text>
<text x="658.0" y="340.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Экспорт FBX с чтением назад</tspan>
<tspan x="658.0" dy="17.5">Владелец: adapters/max/agr_tools/export_core.py</tspan>
<tspan x="658.0" dy="17.5">проверенный экспорт Max: FBX и отчёт пишутся вместе или</tspan>
<tspan x="658.0" dy="17.5">не пишутся; рядом — export_meta</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">commit: сцена, цель, источник, превью, чтение -&gt; FBX +</tspan>
<tspan x="658.0" dy="17.5">отчёт JSON или отказ до записи</tspan>
<tspan x="658.0" dy="17.5">readback: данные FBX -&gt; объекты, треугольники, материалы,</tspan>
<tspan x="658.0" dy="17.5">масштаб единиц</tspan>
</text>
<text x="1573.0" y="340.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1573.0" dy="14">Контракт export_meta</tspan>
<tspan x="1573.0" dy="17.5">Владелец: adapters/max/agr_tools/export_meta.py</tspan>
<tspan x="1573.0" dy="17.5">schemas/ExportMeta.schema.json; неизвестное — unknown,</tspan>
<tspan x="1573.0" dy="17.5">ноль не подставляется; в ZIP не идёт</tspan>
<tspan x="1573.0" dy="17.5"></tspan>
<tspan x="1573.0" dy="17.5">validate_meta: запись -&gt; отказ с именем поля (лишние</tspan>
<tspan x="1573.0" dy="17.5">ключи, дубли, provenance)</tspan>
<tspan x="1573.0" dy="17.5">record_export: экспорт, факты, provenance -&gt; запись</tspan>
<tspan x="1573.0" dy="17.5">export_meta</tspan>
<tspan x="1573.0" dy="17.5">address_meta_path: папка пакета, [--meta], prefer_oks -&gt;</tspan>
<tspan x="1573.0" dy="17.5">запись адреса: --meta; иначе общий export_meta.json папки</tspan>
<tspan x="1573.0" dy="17.5">(важнее sidecar); иначе единственный sidecar, для НПМ —</tspan>
<tspan x="1573.0" dy="17.5">единственный sidecar ОКС; несколько — отказ;</tspan>
<tspan x="1573.0" dy="17.5">pkg.parent/export_meta.json — только если в папке записей</tspan>
<tspan x="1573.0" dy="17.5">нет</tspan>
<tspan x="1573.0" dy="17.5">export_binding: члены архива, записи export_meta -&gt;</tspan>
<tspan x="1573.0" dy="17.5">привязка каждого FBX к записанному SHA-256 экспорта</tspan>
<tspan x="1573.0" dy="17.5">(exported_sha256 / fbx_records); нет записи, конфликт или</tspan>
<tspan x="1573.0" dy="17.5">несовпадение — проблема, оба упаковщика отказывают</tspan>
</text>
<text x="1573.0" y="752.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1573.0" dy="14">Чтение экспорта, валидатор V001–V017, xView, отчёт сдачи</tspan>
<tspan x="1573.0" dy="17.5">Владелец: tools/qa/validate_package.py</tspan>
<tspan x="1573.0" dy="17.5">проверка пакета по регламенту (agr validate); not_run —</tspan>
<tspan x="1573.0" dy="17.5">не pass</tspan>
<tspan x="1573.0" dy="17.5"></tspan>
<tspan x="1573.0" dy="17.5">validate_vpm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="1573.0" dy="17.5">находки ВПМ</tspan>
<tspan x="1573.0" dy="17.5">validate_npm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="1573.0" dy="17.5">находки НПМ</tspan>
</text>
<text x="353.0" y="752.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="353.0" dy="14">GeoJSON ВПМ</tspan>
<tspan x="353.0" dy="17.5">Владелец: src/twinqa/geojson.py</tspan>
<tspan x="353.0" dy="17.5">V011: схема, обязательные значения, Glasses; эталон —</tspan>
<tspan x="353.0" dy="17.5">GeoJSON заказчика (D220)</tspan>
<tspan x="353.0" dy="17.5"></tspan>
<tspan x="353.0" dy="17.5">geojson_findings: данные, профиль, Ground, имена стёкол</tspan>
<tspan x="353.0" dy="17.5">-&gt; находки V011</tspan>
</text>
<text x="963.0" y="752.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Пакеты НПМ / ВПМ и передача</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="963.0" dy="17.5">общий писатель ZIP сдачи (_write_zip): agr package-npm /</tspan>
<tspan x="963.0" dy="17.5">package-vpm (tools/derive) и AGR Tools (#1361, #1377)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">zip_plan: папка, [адрес], [лимиты] -&gt; архивы НПМ/ВПМ и</tspan>
<tspan x="963.0" dy="17.5">пропуски с причиной; файлы не трогает</tspan>
<tspan x="963.0" dy="17.5">check_members: члены архива -&gt; плоские безопасные имена;</tspan>
<tspan x="963.0" dy="17.5">плохое имя — ошибка до записи</tspan>
<tspan x="963.0" dy="17.5">_write_zip: папка, архив, цель -&gt; новый ZIP через</tspan>
<tspan x="963.0" dy="17.5">.partial без перезаписи; дубль, пустой вход, изменение во</tspan>
<tspan x="963.0" dy="17.5">время упаковки — ошибка</tspan>
<tspan x="963.0" dy="17.5">zip_apply: предпросмотр -&gt; новая папка Сборка_&lt;время&gt;,</tspan>
<tspan x="963.0" dy="17.5">ZIP + проверка; ГОТОВО.txt только без провалов</tspan>
<tspan x="963.0" dy="17.5">delivery_receipt: сданный ZIP / .max -&gt; квитанция {file,</tspan>
<tspan x="963.0" dy="17.5">sha256, size}: контроль байтов, не приёмка модели (#1647)</tspan>
<tspan x="963.0" dy="17.5">check_delivery_receipt: файл, квитанция -&gt; пересчёт хеша;</tspan>
<tspan x="963.0" dy="17.5">неполная, чужая или устаревшая квитанция — отказ, не</tspan>
<tspan x="963.0" dy="17.5">обновление; agr validate читает её из &lt;ZIP&gt;.delivery.json</tspan>
<tspan x="963.0" dy="17.5">/ package_report.json</tspan>
<tspan x="963.0" dy="17.5">qa_package: набор пакетов -&gt; отчёт только для чтения;</tspan>
<tspan x="963.0" dy="17.5">сверка пары ОКС &lt;-&gt; Ground (geojson_cross) и одного</tspan>
<tspan x="963.0" dy="17.5">мастера (manifest_cross_master): сосед найден; результат</tspan>
<tspan x="963.0" dy="17.5">сверки может быть неполным (#1681)</tspan>
<tspan x="963.0" dy="17.5">cross_passports: пути пакетов -&gt; находки geojson_cross по</tspan>
<tspan x="963.0" dy="17.5">найденным парам; обязанность ядра, agr validate её не</tspan>
<tspan x="963.0" dy="17.5">выполняет</tspan>
<tspan x="963.0" dy="17.5">cross_masters: пути пакетов -&gt; находки</tspan>
<tspan x="963.0" dy="17.5">manifest_cross_master; обязанность ядра, agr validate её</tspan>
<tspan x="963.0" dy="17.5">не выполняет</tspan>
</text>
<text x="963.0" y="1311.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="12">Дубли вне владельца: 3</tspan>
<tspan x="963.0" dy="15.0">Правило проверки: свой писатель ZIP вместо общего _write_zip;</tspan>
<tspan x="963.0" dy="15.0">охрана jobs/, tools/, src/ (#1377)</tspan>
</text>
<text x="963.0" y="1436.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Чекер СИНТЕЗ и загрузка архива</tspan>
<tspan x="963.0" dy="17.5">Владелец: tools/qa/sintez_checker.py</tspan>
<tspan x="963.0" dy="17.5">agr checker: ZIP папки -&gt; чекер AGR 1.6.1 в Blender</tspan>
<tspan x="963.0" dy="17.5">(tools/blender/sintez_checker.py через blender_runner);</tspan>
<tspan x="963.0" dy="17.5">находки — доказательство, не вердикт</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">classify: папка -&gt; не больше одного ZIP ВПМ (hp) и одного</tspan>
<tspan x="963.0" dy="17.5">НПМ (lp); иначе отказ</tspan>
<tspan x="963.0" dy="17.5">run: папка, выход -&gt; копия ZIP, запуск чекера, сводка</tspan>
<tspan x="963.0" dy="17.5">NEW.json; изменение ZIP во время прогона — отказ</tspan>
</text>
<text x="963.0" y="1645.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="12">Дубли вне владельца: 1</tspan>
</text>
<rect x="805.0" y="518.75" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="835.0" y="518.75" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="835.0" dy="14">сцена НПМ / ВПМ</tspan>
</text>
<rect x="1770.0" y="301.25" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1800.0" y="301.25" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1800.0" dy="14">FBX + факты</tspan>
</text>
<rect x="1567.5" y="713.75" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1597.5" y="713.75" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1597.5" dy="14">свежее чтение</tspan>
</text>
<rect x="1710.0" y="997.5" width="60" height="35.0" fill="#ffffff" opacity="0.9"/>
<text x="1740.0" y="997.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1740.0" dy="14">адрес, верх,</tspan>
<tspan x="1740.0" dy="17.5">превью</tspan>
</text>
<rect x="1110.0" y="713.75" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1140.0" y="713.75" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1140.0" dy="14">GeoJSON ВПМ</tspan>
</text>
<rect x="1415.0" y="593.75" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1445.0" y="593.75" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1445.0" dy="14">запись ZIP</tspan>
</text>
<rect x="1720.0" y="887.5" width="60" height="105.0" fill="#ffffff" opacity="0.9"/>
<text x="1750.0" y="887.5" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1750.0" dy="14">ZIP +</tspan>
<tspan x="1750.0" dy="17.5">квитанция;</tspan>
<tspan x="1750.0" dy="17.5">passed/status</tspan>
<tspan x="1750.0" dy="17.5">упаковщика</tspan>
<tspan x="1750.0" dy="17.5">валидатор не</tspan>
<tspan x="1750.0" dy="17.5">читает</tspan>
</text>
<rect x="1415.0" y="1260.75" width="60" height="17.5" fill="#ffffff" opacity="0.9"/>
<text x="1445.0" y="1260.75" font-size="14" text-anchor="middle" fill="#1e1e1e">
<tspan x="1445.0" dy="14">те же ZIP</tspan>
</text>
</svg>
