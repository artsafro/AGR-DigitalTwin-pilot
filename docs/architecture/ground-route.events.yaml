hotspots:
  - id: legend-intake
    stage: sources
    ru: "agr inspect читает манифест задания. Инвентаризация DXF (слои, блоки, штриховки) помогает, но не заменяет сверку с легендой проекта."
    evidence:
      - src/dt_ai/procedure.py
      - tools/source/inspect_ground_dxf.py
  - id: hatch-colours
    stage: surfaces
    ru: "Силикатный: цвет ID = фон штриховки (bgcolor), а не цвет линий — agr ground site берёт bgcolor, без фона — только цвет из спецификации с причиной (#1406); остаётся белая разметка на каждом стыке покрытий. ID материалов Ватутино v015 (ground-material-ids-v015.json) — историческое свидетельство писателя build_ground_v015.py, не вход ground_site: его ID и материалы приходят из спецификации (covers, блок materials)"
    evidence:
      - jobs/silikatniy-uvk-pzu-viz/LESSONS.md
      - docs/procedure/node-r5-ground.md
      - jobs/VATUTINO-SITE/ground-material-ids-v015.json
  - id: project-zero
    stage: zero
    ru: "Граница участка и ноль приходят из проекта (или агент уточняет, D293); agr zero / dt ground zero (tools/ground/project_zero.py → export_z_check) проверяет OBJ по рельефу и заданной отметке, не определяет ноль и не извлекает границу. h_relief = ноль проекта (D279); Силикатный (#1315) — ±0.000 из ПЗУ / ВП_5, система высот КПП1 / ТЭЦ26 — unknown."
    rules:
      - D279
      - D293
    evidence:
      - docs/research/placement-heights-1330.md
      - src/dt_ai/core/heights.py
      - tools/ground/project_zero.py
  - id: pairing
    stage: quads
    ru: "agr ground site выдаёт треугольники в OBJ, не рабочий FBX с квадами (D366). Историческая agr ground v015 / dt ground v015 (build_ground_v015.py) повторяет только Ватутино v014→v015 и спаривает треугольники уже после рельефа, не закрывая общий дорельефный этап quads. Для v015: D192 заменено D157 (≤ 35 % остаточных треугольников), маршрут A с исключением texel_ready (D193)."
    rules:
      - D157
      - D192
      - D193
    evidence:
      - jobs/VATUTINO-SITE/ground-v015-route-proposal-20261104.md
      - tools/ground/build_ground_v015.py
  - id: flat-uv
    stage: textures
    ru: "ground_site назначает плоским граням UV / UDIM по ID до проекции: плотный индекс занятых покрытий с 1001 независимо от рабочих ID, таблица ground-udim.json / .md (D399, #1898); без блока materials в спецификации — без файлов текстур и атласа НПМ, с ним — .mtl и diffuse PNG из библиотеки, атласа НПМ нет и тогда. Отдельно: опциональный VPM readback поверхности Ground в ground_json_to_fbx.py (#1876) сверяет тайлы по материалам с переданным JSON-эталоном и явным export_meta.json; это не валидация итогового сводного FBX участка (agr validate --scene, V008 в twinqa.scene)."
    evidence:
      - src/dt_ai/geometry/ground_site.py
      - tools/ground/build_ground_site.py
      - tools/blender/ground_json_to_fbx.py
      - src/twinqa/scene.py
  - id: steep-step
    stage: relief
    ru: "Ватутино: ступень 80° на южной границе — обрыв TIN между двумя отметками подпорной стены без геометрии (1079ED / 1079EE, 0,75 м в плане, перепад 3,73 м); вырез под пятно — точечные исключения"
    rules:
      - D150
      - D191
    evidence:
      - docs/research/vatutino-ground-80deg-step-source.md
      - jobs/VATUTINO-SITE/ground-notch-approval-v015.json
  - id: skirt-gap
    stage: skirt
    ru: "Юбка: 20 внешних рёбер Ватутино v015 дали опуск 0 (GND-03) — юбка есть, рёбра лежат на крутой полосе 80°; ТЭЦ26 — «полигоны по периметру утоплены минимум на метр вниз»; agr ground site считает опуск каждого внешнего ребра (skirt_gap_edges), v015 не правится (#1406)"
    rules:
      - D251
    evidence:
      - docs/research/vatutino-ground-v015-outer-skirt-gap-20-edges.md
      - jobs/TEC26-OKS/STATE.md
  - id: builder-outputs
    stage: skirt
    ru: "ground_site оркестрирует ground_cake.build_flat (плоский и уточнённый по рельефу меши), после проекции назначает UDIM по ID поверхности и UV юбки по соседней грани. Выходы agr ground site: ground-flat.obj, SM_<site>_Ground.obj, ground-udim.json / .md, ground-report.json; .mtl и diffuse PNG — только при блоке materials в спецификации. Исторические писатели JSON-мастера — отдельные пути: build_ground_v015.py (Ватутино v015, master-{npm,vpm}.json по ground-material-ids-v015.json) и jobs/VATUTINO-SITE/build_ground.py (ground_master_{vpm,npm}.json); равные меши или хеши с OBJ не предполагаются, прямого перехода OBJ → JSON / FBX нет."
    evidence:
      - src/dt_ai/geometry/ground_site.py
      - src/dt_ai/geometry/ground_cake.py
      - tools/ground/build_ground_site.py
      - tools/ground/build_ground_v015.py
      - jobs/VATUTINO-SITE/build_ground.py
      - jobs/VATUTINO-SITE/ground-material-ids-v015.json
  - id: obj-to-ucx
    stage: ucx
    ru: "agr ucx принимает FBX или Blend, пишет FBX. Прямой переход от OBJ сборщика не подключён в общем маршруте."
    evidence:
      - src/dt_ai/geometry/ucx_command.py
  - id: obj-to-placement
    stage: placement
    ru: "На каждый профиль: master JSON + (offset или readback с placement_offset) + (FBX или mesh). Прямой переход от OBJ сборщика не подключён в общем маршруте. Выход — сцены Blender (.blend на вариант); Max atlas_groundel принимает узлы сцены Max, общий автоматический мост от .blend к нему не установлен (ручной перенос не исключён)."
    evidence:
      - src/dt_ai/placement/site.py
      - adapters/max/agr_tools/flora_atlas_max.py
  - id: outside-ground-stop
    stage: placement
    ru: "D302 vs команда (dt_ai.placement, D329): целевое правило D302 — удалить объект вне Ground и записать в отчёт. В dt place site / agr place (site.py + scene.py) одобренные исключения из spec.exceptions (apply_ground_exceptions: approved + снимок точки + ground_master_sha256) исключаются до engine.place и пишутся в results.json (excluded: ground_exception; при новом Ground становятся stale). Новый промах вне Ground (point_outside_ground / point_over_ground_hole в engine_report.json) останавливает строгий парный прогон в make_plan (status=stopped, выход 1) до инстансирования."
    rules:
      - D302
      - D329
    evidence:
      - src/dt_ai/placement/engine.py
      - src/dt_ai/placement/site.py
      - src/dt_ai/placement/scene.py
      - jobs/VATUTINO-SITE/ground-exceptions-v015.json
      - jobs/VATUTINO-SITE/placement-report.md
