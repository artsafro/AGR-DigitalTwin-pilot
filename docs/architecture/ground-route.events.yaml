# Event storm of the Ground route, NPM + VPM (#1383; v2 per Artem 2026-11-14, D293, #1392).
# Source of truth for docs/architecture/ground-route.excalidraw.
# Same method as the NPM/OKS map (#1359): Russian labels for Artem; commands, D-rows, paths and ids as in the repo.
# commands: existing `agr` / `dt` commands only; a stage without one is drawn dashed «Нет команды agr/dt».
# rules: D-rows of docs/decisions.md. evidence: repo paths that exist (R5 recipe, Vatutino Ground v015,
# #1330 heights research with the #1315 Silikatny decision, KPP1 / TEC26 Ground notes, Kasatkino, Silikatny DWG).
# context: id from contexts.yaml or from local_contexts below; every stage context is also listed with the same
# owner in this route's own context map ground-contexts.yaml (#1392, route_coverage).
# v2 (D293): flat ground first (IDs, triangles / seams / insets, textures by ID), the relief LAST (projection of
# the flat ground onto the relief), then texture fix + skirt, UCX, MAF + Flora, an NPM stage, export, checks.
# Checked by tests/test_route_maps_1383.py and tests/test_route_maps_1392.py.
# Regenerate: uv run python tools/architecture/route_map.py
title_ru: "Маршрут Ground (НПМ + ВПМ) — целевой порядок D293: событийный штурм"
route: ground
scheme:
  export_context:
    ref: package-contexts.yaml#export
  source_ru: "DWG / ПЗУ / PDF и рельеф: ревизия, SHA-256 и проектный ноль в реестре исходников"
  steps:
    - stages: "sources,zero"
      ru: "Сверить покрытия с легендой, взять границу и ноль из проекта"
      artifact_ru: "Граница, покрытия, отметки и реестр исходников"
      gate_ru: "Ноль уточнить, если не указан; agr inspect читает манифест, agr zero проверяет OBJ по заданному нулю"
    - stages: "surfaces,quads,textures"
      ru: "Собрать плоский Ground, назначить UV / UDIM до проекции"
      artifact_ru: "ground-flat.obj — треугольники с UV, без файлов текстур"
      gate_ru: "Покрытия сверены с легендой проекта"
    - stages: "relief,skirt,ucx"
      ru: "Спроецировать Ground, обработать UV юбки; отдельно построить UCX ВПМ"
      artifact_ru: "SM_<site>_Ground.obj и ground-report.json; UCX отдельно (вход FBX / Blend)"
      gate_ru: "Прямого перехода от OBJ к agr ucx нет в общем маршруте; швы и юбку проверить"
    - stages: "placement,npm"
      ru: "Расставить МАФ / Флору и получить НПМ"
      artifact_ru: "Сцены НПМ / ВПМ, engine_report.json и results.json (список excluded с причинами / stopped)"
      gate_ru: "Расстановка (dt_ai.placement): master JSON + (offset или readback) + (FBX или mesh), не OBJ сборщика; цель D302 vs команда — только одобренные исключения по точке и sha256 Ground пропускаются, новый промах останавливает прогон до инстансирования; agr vpm-to-npm не конвертирует Ground"
    - stages: "export"
      ru: "Экспортировать НПМ / ВПМ отдельно от упаковки"
      artifact_ru: "Ground FBX сдачи и рабочий FBX с квадами (D366)"
      gate_ru: "Blender Ground JSON-to-FBX читает JSON-мастер, не OBJ сборщика"
    - stages: "package"
      ru: "Упаковать готовые файлы"
      artifact_ru: "ZIP; схема «Пакет и сдача»"
      gate_ru: "Упаковка не означает приёмку"
    - stages: "validate,sintez"
      ru: "Проверить Ground и передать Артёму"
      artifact_ru: "Отчёт, xView и находки СИНТЕЗ"
      gate_ru: "Отказы не скрыты; визуальная приёмка — в маршруте сдачи"
