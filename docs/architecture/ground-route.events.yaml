hotspots:
  - id: legend-intake
    stage: sources
    ru: "agr inspect читает манифест задания. Инвентаризация DXF (слои, блоки, штриховки) помогает, но не заменяет сверку с легендой проекта."
    evidence:
      - src/dt_ai/procedure.py
      - tools/source/inspect_ground_dxf.py
  - id: hatch-colours
    stage: surfaces
    ru: "Силикатный: цвет ID = фон штриховки (bgcolor), а не цвет линий — agr ground site берёт bgcolor, без фона — только цвет из спецификации с причиной (#1406); остаётся белая разметка на каждом стыке покрытий"
    evidence:
      - jobs/silikatniy-uvk-pzu-viz/LESSONS.md
      - docs/procedure/node-r5-ground.md
  - id: project-zero
    stage: zero
    ru: "agr zero проверяет OBJ по рельефу и заданной отметке, не определяет ноль. h_relief = ноль проекта (D279); Силикатный (#1315) — ±0.000 из ПЗУ / ВП_5, система высот КПП1 / ТЭЦ26 — unknown."
    rules:
      - D279
      - D293
    evidence:
      - docs/research/placement-heights-1330.md
      - src/dt_ai/core/heights.py
  - id: pairing
    stage: quads
    ru: "agr ground site выдаёт треугольники в OBJ, не рабочий FBX с квадами (D366). Историческая agr ground v015 / dt ground v015 (build_ground_v015.py) повторяет только Ватутино v014→v015 и спаривает треугольники уже после рельефа, не закрывая общий дорельефный этап quads. Для v015: D192 заменено D157 (≤ 35 % остаточных треугольников), маршрут A с исключением texel_ready (D193)."
    rules:
      - D157
      - D192
      - D193
    evidence:
      - jobs/VATUTINO-SITE/ground-v015-route-proposal-20261104.md
      - tools/ground/build_ground_v015.py
  - id: flat-uv
    stage: textures
    ru: "ground_site назначает плоским граням UV / UDIM по ID до проекции, без файлов текстур и атласа НПМ."
    evidence:
      - src/dt_ai/geometry/ground_site.py
  - id: steep-step
    stage: relief
    ru: "Ватутино: ступень 80° на южной границе — обрыв TIN между двумя отметками подпорной стены без геометрии (1079ED / 1079EE, 0,75 м в плане, перепад 3,73 м); вырез под пятно — точечные исключения"
    rules:
      - D150
      - D191
    evidence:
      - docs/research/vatutino-ground-80deg-step-source.md
      - jobs/VATUTINO-SITE/ground-notch-approval-v015.json
  - id: skirt-gap
    stage: skirt
    ru: "Юбка: 20 внешних рёбер Ватутино v015 дали опуск 0 (GND-03) — юбка есть, рёбра лежат на крутой полосе 80°; ТЭЦ26 — «полигоны по периметру утоплены минимум на метр вниз»; agr ground site считает опуск каждого внешнего ребра (skirt_gap_edges), v015 не правится (#1406)"
    rules:
      - D251
    evidence:
      - docs/research/vatutino-ground-v015-outer-skirt-gap-20-edges.md
      - jobs/TEC26-OKS/STATE.md
  - id: builder-outputs
    stage: skirt
    ru: "ground_site после проекции назначает UDIM по ID поверхности и UV юбки по соседней грани. Выходы: ground-flat.obj, SM_<site>_Ground.obj, ground-report.json."
    evidence:
      - src/dt_ai/geometry/ground_site.py
      - tools/ground/build_ground_site.py
  - id: obj-to-ucx
    stage: ucx
    ru: "agr ucx принимает FBX или Blend, пишет FBX. Прямой переход от OBJ сборщика не подключён в общем маршруте."
    evidence:
      - src/dt_ai/geometry/ucx_command.py
  - id: obj-to-placement
    stage: placement
    ru: "На каждый профиль: master JSON + (offset или readback с placement_offset) + (FBX или mesh). Прямой переход от OBJ сборщика не подключён в общем маршруте."
    evidence:
      - src/dt_ai/placement/site.py
  - id: outside-ground-stop
    stage: placement
    ru: "D302 vs команда (dt_ai.placement, D329): целевое правило D302 — удалить объект вне Ground и записать в отчёт. В dt place site / agr place (site.py + scene.py) одобренные исключения из spec.exceptions (apply_ground_exceptions: approved + снимок точки + ground_master_sha256) исключаются до engine.place и пишутся в results.json (excluded: ground_exception; при новом Ground становятся stale). Новый промах вне Ground (point_outside_ground / point_over_ground_hole в engine_report.json) останавливает строгий парный прогон в make_plan (status=stopped, выход 1) до инстансирования."
    rules:
      - D302
      - D329
    evidence:
      - src/dt_ai/placement/engine.py
      - src/dt_ai/placement/site.py
      - src/dt_ai/placement/scene.py
      - jobs/VATUTINO-SITE/ground-exceptions-v015.json
      - jobs/VATUTINO-SITE/placement-report.md
  - id: ground-atlas
    stage: npm
    ru: "agr vpm-to-npm не конвертирует Ground. Числа треугольников v015 показывают бюджет, но не доказывают совпадение поверхности."
    evidence:
      - src/dt_ai/cli/agr.py
      - jobs/VATUTINO-SITE/site-route-20261109.md
  - id: budget
    stage: npm
    ru: "Бюджет НПМ 180 000 (GND-04): Ground 46 479 + МАФ 55 403 + Флора 64 454 = 166 336; ВПМ Флора 443 788 — делит Артём (D167)"
    rules:
      - D167
      - D097
    evidence:
      - jobs/VATUTINO-SITE/site-route-20261109.md
  - id: kpp1-ground-missing
    stage: package
    ru: "КПП1: Ground делает другой автор, утверждённого Ground FBX нет — пакет без него, подставлять синтетику нельзя; сданный Ground не готов (D288)"
    rules:
      - D262
      - D285
      - D288
    evidence:
      - jobs/KPP1/package-1278/latest/REPORT.md
  - id: obj-to-export
    stage: export
    ru: "Blender Ground JSON-to-FBX принимает JSON-мастер, не OBJ. Прямого перехода от сборщика нет в общем маршруте; это не выпуск рабочего FBX по D366."
    evidence:
      - tools/blender/ground_json_to_fbx.py
  - id: package-input
    stage: package
    ru: "Упаковка берёт готовые файлы, пишет ZIP и не экспортирует FBX. Маршрут сдачи отдельно (#1805)."
    evidence:
      - tools/derive/package_vpm.py
      - tools/derive/package_npm.py
  - id: xview-parked
    stage: validate
    ru: "xView v015: последняя записанная сессия — xView не чистый; срез сдачи 2026-11-09 (option A) называет v015, но xView-находки не сняты и приёмка не подтверждена; #371 закрыт, участок #298 шёл на v014"
    rules:
      - D152
    evidence:
      - jobs/VATUTINO-SITE/ground-v015-final-xview-session.md
      - docs/deliveries/vatutino-site-2026-11-09.md
