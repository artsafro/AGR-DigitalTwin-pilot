<text x="40" y="0" font-size="28" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="28">Карта контекстов маршрута ВПМ / ОКС (UCX) — D293 (#1392)</tspan>
</text>
<text x="40" y="44" font-size="16" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="16">Легенда: зелёный — модуль-владелец и его функции (контракт: вход -&gt; выход); жёлтый — общее ядро; розовый — число записей вне владельца (адреса в таблице владельцев); стрелки — передача между владельцами</tspan>
</text>
<text x="963.0" y="120.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Общее ядро: номер тайла UDIM</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/udimtile_core.py</tspan>
<tspan x="963.0" dy="17.5">одна функция UDIM (#1337); её дубли охраняет карта НПМ</tspan>
<tspan x="963.0" dy="17.5">(contexts.yaml)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">udim_tile: u, v -&gt; номер тайла 1001 + ⌊u⌋ + 10·⌊v⌋; вне</tspan>
<tspan x="963.0" dy="17.5">области — UdimDomainError</tspan>
<tspan x="963.0" dy="17.5">face_tile: углы UV грани -&gt; тайл грани; угол в чужом</tspan>
<tspan x="963.0" dy="17.5">тайле — UdimCrossTileError</tspan>
</text>
<text x="48" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48" dy="14">Связь с DCC (Blender / 3ds Max / AGR Tools)</tspan>
<tspan x="48" dy="17.5">Владелец: src/dt_ai/core/blender_runner.py</tspan>
<tspan x="48" dy="17.5">агент работает там, где удобно (D293); запуск Blender без</tspan>
<tspan x="48" dy="17.5">окна со свежим JSON-ответом</tspan>
<tspan x="48" dy="17.5"></tspan>
<tspan x="48" dy="17.5">blender_executable: --blender &gt; DT_BLENDER (CLI dt qa /</tspan>
<tspan x="48" dy="17.5">agr) &gt; TWINQA_BLENDER (blender_runner) &gt; установка 5.1.2;</tspan>
<tspan x="48" dy="17.5">путь к Blender</tspan>
<tspan x="48" dy="17.5">run_blender: скрипт, аргументы, ожидаемые выходы, таймаут</tspan>
<tspan x="48" dy="17.5">-&gt; свежий JSON; старый ответ — ошибка</tspan>
</text>
<text x="658" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658" dy="14">Корпус по частям</tspan>
<tspan x="658" dy="17.5">Владелец: src/dt_ai/ops/operations.py</tspan>
<tspan x="658" dy="17.5">операции над частями с проверкой инвариантов и откатом</tspan>
<tspan x="658" dy="17.5">(Blender / Max / AGR Tools)</tspan>
<tspan x="658" dy="17.5"></tspan>
<tspan x="658" dy="17.5">run_operation: сцена, операция, часть, функция правки -&gt;</tspan>
<tspan x="658" dy="17.5">OperationResult; нарушен инвариант — откат</tspan>
<tspan x="658" dy="17.5">embed_into_neighbour: сцена, часть, сосед, направление,</tspan>
<tspan x="658" dy="17.5">глубина -&gt; врезка декора и навесных элементов (D199)</tspan>
</text>
<text x="658" y="549.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="658" dy="12">Дубли вне владельца: 3</tspan>
</text>
<text x="1268" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268" dy="14">Атлас производной НПМ, не UV ВПМ</tspan>
<tspan x="1268" dy="17.5">Владелец: adapters/max/agr_tools/atlas_core.py</tspan>
<tspan x="1268" dy="17.5">упаковка атласа НПМ (D225, D292 пути A / B);</tspan>
<tspan x="1268" dy="17.5">периодические UV ВПМ принадлежат vpm_uv.py</tspan>
<tspan x="1268" dy="17.5"></tspan>
<tspan x="1268" dy="17.5">pack: вершины, UV, грани, материалы, режим, размер,</tspan>
<tspan x="1268" dy="17.5">отступ -&gt; новые UV, тайлы UDIM, ячейки</tspan>
<tspan x="1268" dy="17.5">atlas_png: раскладка -&gt; PNG атласа</tspan>
</text>
<text x="1878" y="357.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1878" dy="14">Периодическая UV-развёртка ВПМ</tspan>
<tspan x="1878" dy="17.5">Владелец: tools/blender/vpm_uv.py</tspan>
<tspan x="1878" dy="17.5">общее Blender bmesh-ядро ВПМ (#1380, D320); не упаковщик</tspan>
<tspan x="1878" dy="17.5">атласа НПМ</tspan>
<tspan x="1878" dy="17.5"></tspan>
<tspan x="1878" dy="17.5">texel_cut: bmesh, имена отделок, spec -&gt; разрезы по</tspan>
<tspan x="1878" dy="17.5">периодам текстуры</tspan>
<tspan x="1878" dy="17.5">pack_uv: bmesh, имена отделок, spec -&gt; UVMap и QA;</tspan>
<tspan x="1878" dy="17.5">периодические острова можно stack (D320)</tspan>
</text>
<text x="1878" y="549.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="1878" dy="12">Дубли вне владельца: 2</tspan>
</text>
<text x="48.0" y="644.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="14">НПМ в тех же координатах (ВПМ → НПМ)</tspan>
<tspan x="48.0" dy="17.5">Владелец: tools/derive/npm_atlas.py</tspan>
<tspan x="48.0" dy="17.5">атлас НПМ из UDIM для agr vpm-to-npm; путь B —</tspan>
<tspan x="48.0" dy="17.5">параллельная НПМ по ID (D293)</tspan>
<tspan x="48.0" dy="17.5"></tspan>
<tspan x="48.0" dy="17.5">validate_export: раскладка, диффуз, прозрачность -&gt; замер</tspan>
<tspan x="48.0" dy="17.5">отступов по прочитанным UV и PNG</tspan>
<tspan x="48.0" dy="17.5">main: аргументы dt derive atlas -&gt; атлас НПМ и отчёт;</tspan>
<tspan x="48.0" dy="17.5">ошибка — ненулевой код</tspan>
</text>
<text x="658.0" y="644.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Проёмы и окна</tspan>
<tspan x="658.0" dy="17.5">Владелец: adapters/max/agr_tools/windowgen_core.py</tspan>
<tspan x="658.0" dy="17.5">agr window-generate / Max win.generate: библиотека с</tspan>
<tspan x="658.0" dy="17.5">утоплением или генератор D322; один 3D owner стекла</tspan>
<tspan x="658.0" dy="17.5">(#1405)</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">load_library: папка библиотеки -&gt; типы окон, стандарт,</tspan>
<tspan x="658.0" dy="17.5">sha256 файлов</tspan>
<tspan x="658.0" dy="17.5">library_report: типы, стандарт -&gt; строка на тип: pass /</tspan>
<tspan x="658.0" dy="17.5">quarantine / duplicate с причиной</tspan>
<tspan x="658.0" dy="17.5">offerable: отчёт библиотеки -&gt; id, которые можно</tspan>
<tspan x="658.0" dy="17.5">предлагать (только pass)</tspan>
<tspan x="658.0" dy="17.5">build_type: тип окна, стандарт, опции -&gt; меш окна по</tspan>
<tspan x="658.0" dy="17.5">стандарту библиотеки</tspan>
</text>
<text x="658.0" y="923.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="12">Дубли вне владельца: 4</tspan>
</text>
<text x="1268.0" y="644.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="14">Кровля, парапет, плита, ограждение</tspan>
<tspan x="1268.0" dy="17.5">Владелец: adapters/max/agr_tools/roof_core.py</tspan>
<tspan x="1268.0" dy="17.5">плита кровли врезана в парапет и поднята на несколько мм</tspan>
<tspan x="1268.0" dy="17.5">(R6, D292)</tspan>
<tspan x="1268.0" dy="17.5"></tspan>
<tspan x="1268.0" dy="17.5">boundary_loops: грани -&gt; замкнутые петли открытых рёбер в</tspan>
<tspan x="1268.0" dy="17.5">обходе их граней</tspan>
<tspan x="1268.0" dy="17.5">slab: меш, петля, грани-владельцы, опции -&gt; одна плита</tspan>
<tspan x="1268.0" dy="17.5">кровли или Ambiguous</tspan>
<tspan x="1268.0" dy="17.5">plan: корпуса (меш в метрах, мир) -&gt; опции, строки плит,</tspan>
<tspan x="1268.0" dy="17.5">находки</tspan>
<tspan x="1268.0" dy="17.5">hole_plate: план отверстия парапета, уровень, верх,</tspan>
<tspan x="1268.0" dy="17.5">внешний контур -&gt; плита кровли (сборщик задания, #1381)</tspan>
<tspan x="1268.0" dy="17.5">или ошибка</tspan>
</text>
<text x="1268.0" y="923.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="12">Дубли вне владельца: 2</tspan>
</text>
<text x="1878.0" y="644.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1878.0" dy="14">Экспорт и пакеты ВПМ / НПМ</tspan>
<tspan x="1878.0" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="1878.0" dy="17.5">единственный писатель ZIP сдачи (_write_zip): agr</tspan>
<tspan x="1878.0" dy="17.5">package-npm / package-vpm (tools/derive) и AGR Tools</tspan>
<tspan x="1878.0" dy="17.5">(#1361, #1377)</tspan>
<tspan x="1878.0" dy="17.5"></tspan>
<tspan x="1878.0" dy="17.5">zip_plan: папка, [адрес], [лимиты] -&gt; архивы НПМ/ВПМ и</tspan>
<tspan x="1878.0" dy="17.5">пропуски с причиной; файлы не трогает</tspan>
<tspan x="1878.0" dy="17.5">check_members: члены архива -&gt; плоские безопасные имена;</tspan>
<tspan x="1878.0" dy="17.5">плохое имя — ошибка до записи</tspan>
<tspan x="1878.0" dy="17.5">_write_zip: папка, архив, цель -&gt; новый ZIP через</tspan>
<tspan x="1878.0" dy="17.5">.partial без перезаписи; дубль, пустой вход, изменение во</tspan>
<tspan x="1878.0" dy="17.5">время упаковки — ошибка</tspan>
<tspan x="1878.0" dy="17.5">zip_apply: предпросмотр -&gt; новая папка Сборка_&lt;время&gt;,</tspan>
<tspan x="1878.0" dy="17.5">ZIP + полный отчёт проверки; ГОТОВО.txt только после</tspan>
<tspan x="1878.0" dy="17.5">автопроверок, V015–V017 ждут Артёма [D323]; иначе</tspan>
<tspan x="1878.0" dy="17.5">ОШИБКА.txt</tspan>
</text>
<text x="48.0" y="1021.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="14">Проверки, xView, СИНТЕЗ</tspan>
<tspan x="48.0" dy="17.5">Владелец: tools/qa/validate_package.py</tspan>
<tspan x="48.0" dy="17.5">проверка пакета по регламенту (agr validate)</tspan>
<tspan x="48.0" dy="17.5"></tspan>
<tspan x="48.0" dy="17.5">validate_vpm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="48.0" dy="17.5">находки ВПМ и плотность V009</tspan>
<tspan x="48.0" dy="17.5">validate_npm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="48.0" dy="17.5">находки НПМ</tspan>
</text>
<text x="48.0" y="1195.5" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="12">Дубли вне владельца: 1</tspan>
</text>
<text x="658.0" y="1021.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Коллизии UCX (только ВПМ)</tspan>
<tspan x="658.0" dy="17.5">Владелец: adapters/max/agr_tools/ucx10_core.py</tspan>
<tspan x="658.0" dy="17.5">зазоры UCX (D330: ядро на функцию); строит</tspan>
<tspan x="658.0" dy="17.5">src/dt_ai/geometry/ucx_build.py; команда agr ucx (#1404)</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">piece: вершины, треугольники -&gt; выпуклый кусок с</tspan>
<tspan x="658.0" dy="17.5">нормалями и рёбрами</tspan>
<tspan x="658.0" dy="17.5">separation: два выпуклых куска -&gt; нижняя оценка зазора,</tspan>
<tspan x="658.0" dy="17.5">м, и ось</tspan>
<tspan x="658.0" dy="17.5">plan: куски, опции -&gt; зазор каждой соседней пары каждого</tspan>
<tspan x="658.0" dy="17.5">семейства UCX</tspan>
</text>
<text x="658.0" y="1248.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="12">Дубли вне владельца: 2</tspan>
</text>
<text x="1268.0" y="1021.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="14">Триангуляция готовых UCX</tspan>
<tspan x="1268.0" dy="17.5">Владелец: adapters/max/agr_tools/geom_core.py</tspan>
<tspan x="1268.0" dy="17.5">ucx_plan; обёртки TEC26 не строят зазоры ucx10_core</tspan>
<tspan x="1268.0" dy="17.5"></tspan>
<tspan x="1268.0" dy="17.5">ucx_plan: готовые выпуклые куски -&gt; план триангуляции</tspan>
</text>
<text x="1268.0" y="1143.0" font-size="12" text-anchor="start" fill="#1e1e1e">
<tspan x="1268.0" dy="12">Дубли вне владельца: 1</tspan>
</text>
<text x="1878.0" y="1021.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1878.0" dy="14">Запуск триангуляции UCX</tspan>
<tspan x="1878.0" dy="17.5">Владелец: jobs/TEC26-OKS/scripts/ucx_tri_core.py</tspan>
<tspan x="1878.0" dy="17.5">обёртка geom_core.ucx_plan</tspan>
