<text x="30" y="0" font-size="24" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="24">Маршрут НПМ / ОКС v2 на КПП1 — короткая схема</tspan>
</text>
<text x="30" y="80" font-size="13" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="13">Редакция YAML SHA-256: d064e2e0267f7f3a328919c91454fc5d1248fd8d488e22f3e5d7a702000de3a8</tspan>
</text>
<text x="555.0" y="150.0" font-size="15" text-anchor="middle" fill="#1e1e1e">
<tspan x="555.0" dy="15">Ревизия исходников: КПП1: sources.json, ревизия альбома и SHA-256 исходников; неизвестная ревизия останавливает выпуск</tspan>
</text>
<text x="30" y="245" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="30" dy="14">Владелец экспорта (Max): adapters/max/agr_tools/export_core.py</tspan>
<tspan x="30" dy="17.5">Живых обходов владельцев: 33; адреса и миграция — в таблице владельцев. Это маршрут работы, не квитанция успешной сдачи. Blender НПМ:</tspan>
<tspan x="30" dy="17.5">tools/derive/export_npm.py; ВПМ: экспортёр job.</tspan>
</text>
<text x="260.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">1. Описать исходники и согласовать состав</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Артём подтвердил части (Gate 1)</tspan>
</text>
<text x="845.0" y="365.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Реестр исходников + PartsList</tspan>
</text>
<text x="260.0" y="320.0" font-size="13" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="13">Вход: описанная ревизия исходников</tspan>
</text>
<text x="260.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">2. Построить модель и собрать UV / атлас</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Состав и отделки сверены с проектом</tspan>
</text>
<text x="845.0" y="490.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Сцена НПМ; либо мастер → НПМ</tspan>
</text>
<text x="260.0" y="615.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">3. Выгрузить FBX и собрать пакет</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Упаковка не означает приёмку</tspan>
</text>
<text x="845.0" y="615.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: FBX + export_meta + ZIP; детали — схема</tspan>
<tspan x="845.0" dy="20.0">«Пакет и сдача»</tspan>
</text>
<text x="260.0" y="740.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">4. Прочитать экспорт и выполнить проверки</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Отказ / not_run не равны pass</tspan>
</text>
<text x="845.0" y="740.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Свежий отчёт, xView и находки СИНТЕЗ на</tspan>
<tspan x="845.0" dy="20.0">тех же файлах</tspan>
</text>
<text x="260.0" y="865.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="260.0" dy="16">5. Передать результат Артёму</tspan>
<tspan x="260.0" dy="20.0">Приёмка: Визуальная приёмка Артёма отдельно от</tspan>
<tspan x="260.0" dy="20.0">публикации</tspan>
</text>
<text x="845.0" y="865.0" font-size="16" text-anchor="middle" fill="#1e1e1e">
<tspan x="845.0" dy="16">Артефакт: Пакет и сцена Max QUAD для приёмки</tspan>
</text>
