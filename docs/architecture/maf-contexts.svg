<text x="40" y="0" font-size="28" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="28">Карта контекстов маршрута МАФ (GroundEl, НПМ + ВПМ) — D293 (#1393)</tspan>
</text>
<text x="40" y="44" font-size="16" text-anchor="start" fill="#1e1e1e">
<tspan x="40" dy="16">Легенда: зелёный — модуль-владелец и его функции (контракт: вход -&gt; выход); жёлтый — общее ядро; розовый — число записей вне владельца (адреса в таблице владельцев); стрелки — передача между владельцами</tspan>
</text>
<text x="963.0" y="120.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Общее ядро: расстановка МАФ и Флоры (общая с Ground и</tspan>
<tspan x="963.0" dy="17.5">Флорой)</tspan>
<tspan x="963.0" dy="17.5">Владелец: src/dt_ai/placement/engine.py</tspan>
<tspan x="963.0" dy="17.5">один экземпляр на точку СПОЗУ по высоте Ground, утопление</tspan>
<tspan x="963.0" dy="17.5">10 см (D095); low-poly и high-poly — в одни точки (D293)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">place: точки, вершины и треугольники Ground, библиотека,</tspan>
<tspan x="963.0" dy="17.5">seed -&gt; экземпляр или отказ с кодом</tspan>
<tspan x="963.0" dy="17.5">bottom_face_verdict: нижняя грань в мире -&gt; удалить / на</tspan>
<tspan x="963.0" dy="17.5">проверку (D095, D096)</tspan>
<tspan x="963.0" dy="17.5">report_json: отчёт -&gt; строгий JSON: тот же seed и вход -&gt;</tspan>
<tspan x="963.0" dy="17.5">те же байты</tspan>
</text>
<text x="48.0" y="410.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="48.0" dy="14">Связь с DCC (Blender / 3ds Max / AGR Tools)</tspan>
<tspan x="48.0" dy="17.5">Владелец: src/dt_ai/core/blender_runner.py</tspan>
<tspan x="48.0" dy="17.5">спецификация, DWG СПОЗУ, сцена библиотеки — только копии;</tspan>
<tspan x="48.0" dy="17.5">агент работает там, где удобно (D293)</tspan>
<tspan x="48.0" dy="17.5"></tspan>
<tspan x="48.0" dy="17.5">blender_executable: путь или DT_BLENDER -&gt; исполняемый</tspan>
<tspan x="48.0" dy="17.5">файл Blender; нет — ошибка</tspan>
<tspan x="48.0" dy="17.5">run_blender: скрипт, аргументы, ожидаемые выходы, таймаут</tspan>
<tspan x="48.0" dy="17.5">-&gt; свежий JSON; старый ответ — ошибка</tspan>
</text>
<text x="658.0" y="410.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="658.0" dy="14">Библиотека МАФ: каталог 931, манифесты, A101</tspan>
<tspan x="658.0" dy="17.5">Владелец: tools/library/maf_catalogue.py</tspan>
<tspan x="658.0" dy="17.5">аудит сцены библиотеки (G:/Мой диск/AGR-assets/maf) -&gt;</tspan>
<tspan x="658.0" dy="17.5">каталог; не идентификация (T-MAF-1)</tspan>
<tspan x="658.0" dy="17.5"></tspan>
<tspan x="658.0" dy="17.5">match_spec: строки спецификации, записи -&gt; кандидаты</tspan>
<tspan x="658.0" dy="17.5">только по габаритам</tspan>
<tspan x="658.0" dy="17.5">match_npm: записи, НПМ-набор .blend -&gt; кандидаты НПМ</tspan>
<tspan x="658.0" dy="17.5">build_catalogue: план, элементы, сборка -&gt; catalogue.json</tspan>
<tspan x="658.0" dy="17.5">(каждая запись с путями файлов)</tspan>
</text>
<text x="1573.0" y="410.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="1573.0" dy="14">Проверки МАФ: габариты, сглаживание, нижние грани</tspan>
<tspan x="1573.0" dy="17.5">Владелец: src/twinqa/maf_checks.py</tspan>
<tspan x="1573.0" dy="17.5">MAF-04 и MAF-20 на чтении FBX; неизмеренное — not_run, не</tspan>
<tspan x="1573.0" dy="17.5">pass</tspan>
<tspan x="1573.0" dy="17.5"></tspan>
<tspan x="1573.0" dy="17.5">is_groundel: имя меша -&gt; это GroundEl или нет</tspan>
<tspan x="1573.0" dy="17.5">maf_findings: меши, роль, источник, порог сглаживания -&gt;</tspan>
<tspan x="1573.0" dy="17.5">находки МАФ</tspan>
</text>
<text x="2183.0" y="410.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="2183.0" dy="14">ID материалов и атлас МАФ 512</tspan>
<tspan x="2183.0" dy="17.5">Владелец: tools/materials/atlas_maf.py</tspan>
<tspan x="2183.0" dy="17.5">общий список ID (v007, D240) -&gt; атлас 512 RGB и UV JSON;</tspan>
<tspan x="2183.0" dy="17.5">ВПМ — UDIM после Ground (D210)</tspan>
<tspan x="2183.0" dy="17.5"></tspan>
<tspan x="2183.0" dy="17.5">plan_atlas: список материалов -&gt; ячейки атласа (сплошной</tspan>
<tspan x="2183.0" dy="17.5">цвет 64 / 128, узор крупнее)</tspan>
<tspan x="2183.0" dy="17.5">build_atlas: список материалов, выход -&gt; PNG атласа + UV</tspan>
<tspan x="2183.0" dy="17.5">JSON</tspan>
</text>
<text x="963.0" y="665.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">НПМ МАФ на атласе</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/flora_atlas_max.py</tspan>
<tspan x="963.0" dy="17.5">атлас МАФ (GroundEl) в AGR Tools; конвертация ВПМ → НПМ</tspan>
<tspan x="963.0" dy="17.5">или параллельно (D293)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">atlas_groundel: контекст Max, режим, узлы МАФ, превью -&gt;</tspan>
<tspan x="963.0" dy="17.5">атлас МАФ НПМ</tspan>
</text>
<text x="2183.0" y="665.0" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="2183.0" dy="14">UCX: у МАФ нет, у Ground есть (только ВПМ)</tspan>
<tspan x="2183.0" dy="17.5">Владелец: adapters/max/agr_tools/ucx10_core.py</tspan>
<tspan x="2183.0" dy="17.5">канон UCX (D225) — для поверхности Ground; МАФ не</tspan>
<tspan x="2183.0" dy="17.5">учитываются (MAF-22)</tspan>
<tspan x="2183.0" dy="17.5"></tspan>
<tspan x="2183.0" dy="17.5">piece: вершины, треугольники -&gt; выпуклый кусок с</tspan>
<tspan x="2183.0" dy="17.5">нормалями и рёбрами</tspan>
<tspan x="2183.0" dy="17.5">plan: куски, опции -&gt; зазор каждой соседней пары каждого</tspan>
<tspan x="2183.0" dy="17.5">семейства UCX</tspan>
</text>
<text x="963.0" y="902.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="963.0" dy="14">Экспорт и пакеты (МАФ в Ground FBX)</tspan>
<tspan x="963.0" dy="17.5">Владелец: adapters/max/agr_tools/package_core.py</tspan>
<tspan x="963.0" dy="17.5">единственный писатель ZIP сдачи (_write_zip): agr</tspan>
<tspan x="963.0" dy="17.5">package-npm / package-vpm (tools/derive) и AGR Tools</tspan>
<tspan x="963.0" dy="17.5">(#1361, #1377)</tspan>
<tspan x="963.0" dy="17.5"></tspan>
<tspan x="963.0" dy="17.5">zip_plan: папка, [адрес], [лимиты] -&gt; архивы НПМ/ВПМ и</tspan>
<tspan x="963.0" dy="17.5">пропуски с причиной; файлы не трогает</tspan>
<tspan x="963.0" dy="17.5">check_members: члены архива -&gt; плоские безопасные имена;</tspan>
<tspan x="963.0" dy="17.5">плохое имя — ошибка до записи</tspan>
<tspan x="963.0" dy="17.5">_write_zip: папка, архив, цель -&gt; новый ZIP через</tspan>
<tspan x="963.0" dy="17.5">.partial без перезаписи; дубль, пустой вход, изменение во</tspan>
<tspan x="963.0" dy="17.5">время упаковки — ошибка</tspan>
<tspan x="963.0" dy="17.5">zip_apply: предпросмотр -&gt; новая папка Сборка_&lt;время&gt;,</tspan>
<tspan x="963.0" dy="17.5">ZIP + проверка; ГОТОВО.txt только без провалов</tspan>
</text>
<text x="353.0" y="902.5" font-size="14" text-anchor="start" fill="#1e1e1e">
<tspan x="353.0" dy="14">Проверки пакета и витрина для Артёма</tspan>
<tspan x="353.0" dy="17.5">Владелец: tools/qa/validate_package.py</tspan>
<tspan x="353.0" dy="17.5">проверка пакета по регламенту (agr validate)</tspan>
<tspan x="353.0" dy="17.5"></tspan>
<tspan x="353.0" dy="17.5">validate_vpm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="353.0" dy="17.5">находки ВПМ</tspan>
<tspan x="353.0" dy="17.5">validate_npm_zip: имя, файлы ZIP, профиль, стадии -&gt;</tspan>
<tspan x="353.0" dy="17.5">находки НПМ</tspan>
</text>
