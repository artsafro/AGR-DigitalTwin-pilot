# (#1359) and the VPM OKS / Ground maps (#1383, #1392): Russian labels for Artem; commands, D-rows, paths and ids as
# in the repo. commands: existing `agr` / `dt` commands only; a stage without one is drawn dashed «Нет команды agr/dt».
# rules: D-rows of docs/decisions.md. evidence: repo paths that exist (Package sheet, #1361 shared packaging,
# validate-delivery skill, Vatutino site delivery 2026-11-09, KPP1 packages). Steps are tool-agnostic [D293 (1)].
# The OKS / Ground / MAF / Flora routes end in the `package` stage; this map expands it.
# context: id from contexts.yaml or local_contexts; every stage context is in package-contexts.yaml (route_coverage).
# hotspots = RED boxes: a fact the repo leaves open or a step it does not define (a question, not an invention).
# Checked by tests/test_route_maps_1393.py. Regenerate: uv run python tools/architecture/route_map.py
