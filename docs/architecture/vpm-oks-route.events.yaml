# Event storm of the VPM/OKS route (#1383; v2 per Artem 2026-11-14, D293, #1392). Source of truth for docs/architecture/vpm-oks-route.excalidraw.
# Same method as the NPM map (#1359): Russian labels for Artem; commands, D-rows, paths and ids as in the repo.
# commands: existing `agr` / `dt` commands and the D312 master_topology script template; stages without commands are dashed.
# rules: D-rows of docs/decisions.md. evidence: repo paths that exist (KPP1, PSU275, TEC26, ELV, 4BK research).
# context: id from contexts.yaml or from local_contexts below; every stage context is also listed with the same
# owner in this route's own context map vpm-oks-contexts.yaml (#1392, route_coverage).
# v2 (D293): DCC stages are tool-agnostic (actor agent-dcc), an NPM stage sits right before the export.
# Checked by tests/test_route_maps_1383.py and tests/test_route_maps_1392.py. Regenerate: uv run python tools/architecture/route_map.py
title_ru: "Маршрут ВПМ / ОКС v2: событийный штурм (КПП1, ПСУ275, ТЭЦ26, СРЕDА, 4БК)"
route: oks-vpm
scheme:
  source_ru: "КПП1: Revit / DWG / PDF, ревизия и SHA-256 в реестре исходников; неизвестное — остановка"
  steps:
    - stages: "sources,parts,gate1"
      ru: "Описать исходники и согласовать состав"
      artifact_ru: "Реестр исходников + PartsList + бюджет"
      gate_ru: "Артём подтвердил Gate 1"
    - stages: "body,openings,roof,decor"
      ru: "Построить корпус, окна, кровлю и декор"
      artifact_ru: "Сцена ВПМ или мастер"
      gate_ru: "Архитектура сверена с проектом"
    - stages: "uv,ucx,master-topology,npm"
      ru: "Подготовить UV / UDIM, UCX и НПМ"
      artifact_ru: "ВПМ + НПМ в общих координатах"
      gate_ru: "Профили и атлас не подменяют друг друга"
    - stages: "package"
      ru: "Экспортировать и упаковать"
      artifact_ru: "FBX + export_meta + ZIP; схема «Пакет и сдача»"
      gate_ru: "Упаковка не означает приёмку"
    - stages: "readback,validate,sintez"
      ru: "Прочитать экспорт и выполнить проверки"
      artifact_ru: "Свежий отчёт и находки СИНТЕЗ"
      gate_ru: "Отказ / not_run не равны pass"
    - stages: "delivered"
      ru: "Передать результат Артёму"
      artifact_ru: "Пакет и сцена Max QUAD"
      gate_ru: "Артём принимает визуально; публикация отдельно"
object: "KPP1, PSU275, TEC26-OKS, elv-tc-vpm"
issue: "#1392"
actors:
  - id: agent
    ru: "Агент"
  - id: agent-dcc
    ru: "Агент: Blender / Max / AGR Tools"
  - id: artem
    ru: "Артём"
  - id: checker
    ru: "Чекер СИНТЕЗ"
